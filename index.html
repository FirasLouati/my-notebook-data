const INTRO="<article class=\"card lessonblock courseidentity\"><h3>Logique Formelle<\/h3><p>Faculté des Sciences de Gafsa<br>Departement Informatique<br>2026/2027<\/p><\/article><article class=\"card lessonblock objectives\"><h3>Objectifs du cours<\/h3><ul class=\"objectivegrid\"><li style=\"--delay:0ms\"><span class=\"goalnum\">01<\/span><div><h4>Comprendre les fondements<\/h4><p>Découvrir les logiques mathématiques et les techniques de déduction automatique.<\/p><\/div><\/li><li style=\"--delay:70ms\"><span class=\"goalnum\">02<\/span><div><h4>Maîtriser la logique propositionnelle<\/h4><p>Construire des formules, utiliser les connecteurs et interpréter les tables de vérité.<\/p><\/div><\/li><li style=\"--delay:140ms\"><span class=\"goalnum\">03<\/span><div><h4>Explorer la logique des prédicats<\/h4><p>Formaliser les objets, leurs propriétés et leurs relations à l’aide des quantificateurs.<\/p><\/div><\/li><li style=\"--delay:210ms\"><span class=\"goalnum\">04<\/span><div><h4>Passer du langage courant aux formules<\/h4><p>Relier les énoncés exprimés informellement à leur représentation logique.<\/p><\/div><\/li><li style=\"--delay:280ms\"><span class=\"goalnum\">05<\/span><div><h4>Construire des preuves<\/h4><p>Présenter et appliquer différentes méthodes de démonstration formelle.<\/p><\/div><\/li><li style=\"--delay:350ms\"><span class=\"goalnum\">06<\/span><div><h4>Relier logique et informatique<\/h4><p>Adopter une approche mathématique de la programmation et du raisonnement automatique.<\/p><\/div><\/li><\/ul><\/article><article class=\"card lessonblock bibliography\"><h3>Bibliographie et ressources<\/h3><div class=\"referencegrid\"><a class=\"referencecard\" href=\"https://forallx.openlogicproject.org/html/\" target=\"_blank\" rel=\"noopener\"><span class=\"refnumber\">01<\/span><h4>forall x: Calgary — An Introduction to Formal Logic<\/h4><p>P. D. Magnus, Tim Button, Robert Trueman et Richard Zach<\/p><span class=\"refedition\">Édition Fall 2025 · version mise à jour le 27 septembre 2026<\/span><p>Connecteurs, tables de vérité, logique du premier ordre et déduction naturelle.<\/p><span class=\"reflink\">Consulter la référence ↗<\/span><\/a><a class=\"referencecard\" href=\"https://builds.openlogicproject.org/courses/phil379/\" target=\"_blank\" rel=\"noopener\"><span class=\"refnumber\">02<\/span><h4>Sets, Logic, Computation<\/h4><p>Richard Zach · Open Logic Project<\/p><span class=\"refedition\">Édition Fall 2025 / version en ligne<\/span><p>Métalogique, complétude, calculabilité et indécidabilité.<\/p><span class=\"reflink\">Consulter la référence ↗<\/span><\/a><a class=\"referencecard\" href=\"https://openlogicproject.org/about/\" target=\"_blank\" rel=\"noopener\"><span class=\"refnumber\">03<\/span><h4>Open Logic Text<\/h4><p>Open Logic Project<\/p><span class=\"refedition\">Manuel libre en développement continu<\/span><p>Langages logiques, conséquence logique et méthodes de preuve.<\/p><span class=\"reflink\">Consulter la référence ↗<\/span><\/a><a class=\"referencecard\" href=\"https://carnap.io/book\" target=\"_blank\" rel=\"noopener\"><span class=\"refnumber\">04<\/span><h4>The Carnap Book<\/h4><p>Graham Leach-Krouse · Projet Carnap<\/p><span class=\"refedition\">Ressource pédagogique en ligne<\/span><p>Environnement libre pour enseigner et pratiquer la logique formelle.<\/p><span class=\"reflink\">Consulter la référence ↗<\/span><\/a><\/div><\/article><article class=\"card lessonblock\"><h3>ECUEF121 : Algorithmes et Structure des Données<\/h3><p>Volume horaire : Cours 21H ; TD: 10.5H<\/p><p>Semestre : S1<\/p><p>Pré-requis : Aucun<\/p><\/article><article class=\"card lessonblock\"><h3>Contenu de la formation<\/h3><p>1. \tIntroduction<br>2.\tLogique propositionnelle<br>-\tLangage : connecteurs, variables propositionnelles<br>-\tInterprétation de formules<br>-\tModèles (sémantique), validité et inconsistance  <br>-\tEquivalence entre formules <br>-\tSubstitution<br>-\tFormes normales (Conjonctive et Disjonctive)<br>-\tConséquence logique <br>-\tSystème formel de la logique des propositions et Preuve (axiomatique) <br>3.\tLogique des prédicats d’ordre 1<br>-\tTerme, atomes et formules bien formées<br>-\tInterprétation de formules   <br>-\tValidité, inconsistance et modèle sémantique<br>-\tConséquence logique<br>-\tForme Normale Prénexe, de Skolem et Clausale <br>-\tThéorème de Herbrand pour la résolution<br>-\tSystème formel de la logique des prédicats et Preuve (axiomatique)<br>-\tQuelques propriétés : Complétude, Consistance et Décidabilité<\/p><\/article>";
const DATA=[{"title": "Logique Propositionnelle", "slides": [{"title": "Logique Formelle", "blocks": []}, {"title": "Objectifs du cours ", "blocks": ["Ce cours est une introduction aux logiques mathématiques et aux techniques de déduction automatique. Il présente deux modèles de raisonnement fondés sur la logique des propositions et la logique des prédicats, permettant, d’avoir une approche mathématique de la programmation. Nous examinons la logique propositionnelle et la logique des prédicats du premier ordre. Nous discutons les liens entre les aspects formels dans ces logiques et les énoncés exprimés informellement. Différentes méthodes de preuve formelle sont présentées et appliquées."]}, {"title": "Bibliographie", "blocks": ["J.P. Delahaye, Outils Logiques pour l’Intelligence Artificielle, Eyrolles, Paris, 1988.\n-\tJ. Vélu, Méthodes Mathématiques pour l’Informatique,  Dunod, Paris, 2005. "]}, {"title": "ECUEF121 : Algorithmes et Structure des Données", "blocks": ["Volume horaire : Cours 21H ; TD: 10.5H", "Systéme d'évaluation : Mixte", "Semestre : S1", "Pré-requis : Aucun"]}, {"title": "Contenu de la formation", "blocks": ["1. \tIntroduction\n2.\tLogique propositionnelle\n-\tLangage : connecteurs, variables propositionnelles\n-\tInterprétation de formules\n-\tModèles (sémantique), validité et inconsistance  \n-\tEquivalence entre formules \n-\tSubstitution\n-\tFormes normales (Conjonctive et Disjonctive)\n-\tConséquence logique \n-\tSystème formel de la logique des propositions et Preuve (axiomatique) \n3.\tLogique des prédicats d’ordre 1\n-\tTerme, atomes et formules bien formées\n-\tInterprétation de formules   \n-\tValidité, inconsistance et modèle sémantique\n-\tConséquence logique\n-\tForme Normale Prénexe, de Skolem et Clausale \n-\tThéorème de Herbrand pour la résolution\n-\tSystème formel de la logique des prédicats et Preuve (axiomatique)\n-\tQuelques propriétés : Complétude, Consistance et Décidabilité"]}, {"title": "Logique Formelle", "blocks": ["Chapitre 1 : Logique Propositionnelle"]}, {"title": "Historique", "blocks": ["En -300 : Aristote  (considéré souvent comme le père de la ‘Logique’ comme discipline) définit les concepts de la logique, il divise la logique en 3 parties : l’étude de la conception, du jugement et du raisonnement;\nLeibniz (1646-1713) envisage q’une machine puisse raisonner : enchaîner des propositions élémentaires pour faire des déductions; \nEn 1854 : Boole reprend l’étude de Leibniz, il démontre, dans son ouvrage The Laws of Thought (Les lois de la pensée) que tous les processus logiques peuvent être modélisés par des opérations logiques utilisant les opérateurs de base (ET, OU, NON) appliqués à des variables à deux états. Depuis cette date, on peut dire que la logique a migré de la philosophie vers les mathématiques. "]}, {"title": "Historique", "blocks": ["Vers la fin du XIX siècle, Frege fonde la science des systèmes formels et invente le calcul des prédicats. \nAu début du XX siècle, Tarski propose une théorie de la référence expliquant comment relier les objets d’un système formel logique et les objets du monde réel, autrement dit, la formalisation d’un domaine de connaissances par un système formel devient possible. C’est la naissance de la notion de démonstration automatique\nEn 1931, Gödel montre que la logique des prédicats est seulement semi-décidable : il existe une procédure effective pour prouver (en un temps fini)  tout énoncé vrai, mais ce n’est pas le cas pour les énoncés faux."]}, {"title": "Introduction", "blocks": ["La logique est la discipline qui traite des méthodes de raisonnement.\n\nAu niveau élémentaire, la logique fournit des règles et des techniques permettant de déterminer si un argument donné est valide.\n\nLe raisonnement logique est utilisé en mathématiques pour prouver des théorèmes."]}, {"title": "Introduction", "blocks": ["La Logique est la discipline qui s'attaque à la notion de validité des raisonnements, toutefois, la manière de traiter cette notion, les fondements, le formalisme utilisé, etc., changent d’une logique à une autre.\nNous avons une sorte d’arbre d’héritage entre ces différentes logiques :"]}, {"title": "Logique Propositionnelle", "blocks": ["Les éléments de base de la logique sont les propositions\n\nUne proposition (ou énoncé) est une phrase declarative qui est soit vraie, soit fausse, mais pas les deux.\n\nLe domaine de la logique qui traite des propositions s'appellela logique propositionnelle.\n\nLa logique des propositions est une branche de la Logique et plus précisément de la logique classique.\n\nDans la logique des propositions, les opérations qui lient les propositions pour en former d’autres plus complexes sont appelées des connecteurs,\nUn connecteur binaire permet de composer deux propositions pour en obtenir une troisième,\nUn connecteur unaire permet d’obtenir une proposition à partir d’une autre .\n"]}, {"title": "Logique Propositionnelle", "blocks": ["valide = prouvable"]}, {"title": "L’alphabet de la Logique Propositionnelle", "blocks": []}, {"title": "Formules bien formées", "blocks": ["L'ensemble des formules (ou propositions) de la logique propositionnelle est le plus petit ensemble de mots construits sur l'alphabet tel que :\nsi A est une formule atomique alors A est une formule;\nF (faux) est une formule ;\n¬ A est une formule si A est une formule;\n(A   B), (A  B), (A   B) et (A  B) sont des formules si A et B sont des formules.\nN.B: A et B qui désignent ci-dessus des formules sont des ‘metavariables’ car ils ne font pas partie de l'alphabet de LP. \nSi on n’utilise pas des parenthèses, l’ordre de priorité des connecteurs est comme suit : ¬ ,  , , ,   , et l’associativité est à gauche pour chaque connecteur."]}, {"title": "Sémantique", "blocks": ["Le contexte d’une formule est une application qui à chacune des variables présente associe la valeur 0 ou 1. À tout contexte correspond une évaluation de la formule, définie inductivement par les tables de vérité associées aux opérateurs logiques."]}, {"title": "Sémantique", "blocks": ["Exemple: Une table de vérité permet d’associer à chaque contexte la valeur de la formule logique (ici ¬b ⇒ a ∧ ¬b) : "]}, {"title": "Sémantique", "blocks": ["On peut enrichir le langage par de nouveaux opérateurs, en précisant leur table de vérité. C’est le cas des opérateurs XOR, NAND et NOR : "]}], "topics": [{"title": "Historique", "html": "<article class=\"card lessonblock\"><h3>Historique<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>En -300 : Aristote  (considéré souvent comme le père de la ‘Logique’ comme discipline) définit les concepts de la logique, il divise la logique en 3 parties : l’étude de la conception, du jugement et du raisonnement;<\/li><li>Leibniz (1646-1713) envisage q’une machine puisse raisonner : enchaîner des propositions élémentaires pour faire des déductions;<\/li><li>En 1854 : Boole reprend l’étude de Leibniz, il démontre, dans son ouvrage The Laws of Thought (Les lois de la pensée) que tous les processus logiques peuvent être modélisés par des opérations logiques utilisant les opérateurs de base (ET, OU, NON) appliqués à des variables à deux états.<\/li><li>Depuis cette date, on peut dire que la logique a migré de la philosophie vers les mathématiques.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Vers la fin du XIX siècle, Frege fonde la science des systèmes formels et invente le calcul des prédicats.<\/li><li>Au début du XX siècle, Tarski propose une théorie de la référence expliquant comment relier les objets d’un système formel logique et les objets du monde réel, autrement dit, la formalisation d’un domaine de connaissances par un système formel devient possible.<\/li><li>C’est la naissance de la notion de démonstration automatique<\/li><li>En 1931, Gödel montre que la logique des prédicats est seulement semi-décidable&#160;: il existe une procédure effective pour prouver (en un temps fini)  tout énoncé vrai, mais ce n’est pas le cas pour les énoncés faux.<\/li><\/ul><\/div><\/article><div class=\"notice\">Repère historique : le théorème de complétude de Gödel date de 1930, les théorèmes d’incomplétude de 1931. L’indécidabilité générale du premier ordre est établie par Church et Turing en 1936. « Valide » signifie vrai dans toutes les interprétations, et ne doit pas être confondu avec vrai dans une interprétation particulière.<\/div>", "sourceSlides": [7, 8]}, {"title": "Introduction", "html": "<article class=\"card lessonblock\"><h3>Introduction<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La logique est la discipline qui traite des méthodes de raisonnement.<\/li><\/ul><ul class=\"lessonpoints\"><li>Au niveau élémentaire, la logique fournit des règles et des techniques permettant de déterminer si un argument donné est valide.<\/li><\/ul><ul class=\"lessonpoints\"><li>Le raisonnement logique est utilisé en mathématiques pour prouver des théorèmes.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La Logique est la discipline qui s'attaque à la notion de validité des raisonnements, toutefois, la manière de traiter cette notion, les fondements, le formalisme utilisé, etc., changent d’une logique à une autre.<\/li><li>Nous avons une sorte d’arbre d’héritage entre ces différentes logiques :<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Les familles de logiques<\/h3><div class=\"lessonparagraph\"><div class=\"logic-tree-wrap\"><svg class=\"logic-tree\" viewBox=\"0 0 920 530\" role=\"img\" aria-labelledby=\"logic-tree-title logic-tree-description\"><title id=\"logic-tree-title\">Les familles de logiques<\/title><desc id=\"logic-tree-description\">La logique se divise en logiques inductives et déductives. Les logiques déductives comprennent les logiques classiques et non classiques. Les logiques classiques comprennent la logique des propositions et la logique des prédicats.<\/desc><defs><filter id=\"tree-shadow\" x=\"-20%\" y=\"-30%\" width=\"140%\" height=\"170%\"><fedropshadow dx=\"0\" dy=\"7\" stdDeviation=\"6\" flood-color=\"#6b4a9b\" flood-opacity=\".14\" /><\/filter><\/defs><g fill=\"none\" stroke=\"#c8b9e5\" stroke-width=\"4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M450 94 V118 H162.5 V145 M450 118 H605 V145\" /><path d=\"M605 219 V255 H470 V285 M605 255 H762.5 V285\" /><path d=\"M470 359 V395 H327.5 V425 M470 395 H607.5 V425\" /><\/g><g class=\"tree-node\" style=\"--node-color:#8951ed\"><rect x=\"330\" y=\"20\" width=\"240\" height=\"74\" rx=\"21\" fill=\"#8951ed\" filter=\"url(#tree-shadow)\" /><text x=\"450\" y=\"64\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"450\" dy=\"0\">Logique<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#ec579c\"><rect x=\"35\" y=\"145\" width=\"255\" height=\"74\" rx=\"21\" fill=\"#ec579c\" filter=\"url(#tree-shadow)\" /><text x=\"162.5\" y=\"189\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"162.5\" dy=\"0\">Logiques inductives<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#168fc7\"><rect x=\"460\" y=\"145\" width=\"290\" height=\"74\" rx=\"21\" fill=\"#168fc7\" filter=\"url(#tree-shadow)\" /><text x=\"605\" y=\"189\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"605\" dy=\"0\">Logiques déductives<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#19a89a\"><rect x=\"340\" y=\"285\" width=\"260\" height=\"74\" rx=\"21\" fill=\"#19a89a\" filter=\"url(#tree-shadow)\" /><text x=\"470\" y=\"329\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"470\" dy=\"0\">Logiques classiques<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#ef9a23\"><rect x=\"635\" y=\"285\" width=\"255\" height=\"74\" rx=\"21\" fill=\"#ef9a23\" filter=\"url(#tree-shadow)\" /><text x=\"762.5\" y=\"317\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"762.5\" dy=\"0\">Logiques non<\/tspan><tspan x=\"762.5\" dy=\"26\">classiques<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#8a55de\"><rect x=\"205\" y=\"425\" width=\"245\" height=\"74\" rx=\"21\" fill=\"#8a55de\" filter=\"url(#tree-shadow)\" /><text x=\"327.5\" y=\"457\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"327.5\" dy=\"0\">Logique des<\/tspan><tspan x=\"327.5\" dy=\"26\">propositions<\/tspan><\/text><\/g><g class=\"tree-node\" style=\"--node-color:#e4518c\"><rect x=\"485\" y=\"425\" width=\"245\" height=\"74\" rx=\"21\" fill=\"#e4518c\" filter=\"url(#tree-shadow)\" /><text x=\"607.5\" y=\"457\" fill=\"white\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\"><tspan x=\"607.5\" dy=\"0\">Logique des<\/tspan><tspan x=\"607.5\" dy=\"26\">prédicats<\/tspan><\/text><\/g><\/svg><\/div><\/div><\/article>", "sourceSlides": [9, 10]}, {"title": "Logique Propositionnelle", "html": "<article class=\"card lessonblock\"><h3>Logique Propositionnelle<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Les éléments de base de la logique sont les propositions<\/li><\/ul><ul class=\"lessonpoints\"><li>Une proposition (ou énoncé) est une phrase declarative qui est soit vraie, soit fausse, mais pas les deux.<\/li><\/ul><ul class=\"lessonpoints\"><li>Le domaine de la logique qui traite des propositions s'appellela logique propositionnelle.<\/li><\/ul><ul class=\"lessonpoints\"><li>La logique des propositions est une branche de la Logique et plus précisément de la logique classique.<\/li><\/ul><ul class=\"lessonpoints\"><li>Dans la logique des propositions, les opérations qui lient les propositions pour en former d’autres plus complexes sont appelées des connecteurs, Un connecteur binaire permet de composer deux propositions pour en obtenir une troisième, Un connecteur unaire permet d’obtenir une proposition à partir d’une autre .<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>valide = prouvable<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Trois niveaux d’analyse<\/h3><div class=\"lessonparagraph\"><div class=\"triptych\"><div><b>Syntaxe<\/b><p>Langage propositionnel et définition des formules bien formées (fbf ou wff).<\/p><\/div><div><b>Sémantique<\/b><p>Théorie des modèles : validité et conséquence logique entre propositions.<\/p><\/div><div><b>Preuve<\/b><p>Théorie axiomatique : prouvabilité des propositions et déduction.<\/p><\/div><\/div><p class=\"formula\">valide = prouvable<\/p><\/div><\/article>", "sourceSlides": [11, 12]}, {"title": "L’alphabet de la Logique Propositionnelle", "html": "<article class=\"card lessonblock\"><h3>L’alphabet de la Logique Propositionnelle<\/h3><div class=\"lessonparagraph\"><ul><li>Un ensemble dénombrable de variables propositionnelles : p, q, r, il_pleut, la_route_est_mouillée…<\/li><li>Les constantes F (faux, 0) et V (vrai, 1).<\/li><li>Les connecteurs : ¬, ∨, ∧, → et ↔.<\/li><li>Les séparateurs : ( et ).<\/li><\/ul><div class=\"formula\">V ≡ ¬F<br>F ≡ (p ∧ ¬p)<\/div><ul class=\"lessonpoints\"><li>On peut se passer de V en utilisant ¬F, et de F en utilisant une contradiction.<\/li><\/ul><\/div><\/article>", "sourceSlides": [13]}, {"title": "Formules bien formées", "html": "<article class=\"card lessonblock\"><h3>Formules bien formées<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>L’ensemble des formules (ou propositions) de la logique propositionnelle est le plus petit ensemble de mots construits sur l’alphabet tel que :<\/li><li>Si A est une formule atomique, alors A est une formule.<\/li><li>F (faux) est une formule.<\/li><li>¬A est une formule si A est une formule.<\/li><li>(A ∨ B), (A ∧ B), (A → B) et (A ↔ B) sont des formules si A et B sont des formules.<\/li><li>N.B. : A et B désignent ici des formules. Ce sont des « métavariables », car elles ne font pas partie de l’alphabet de LP.<\/li><li>En l’absence de parenthèses, l’ordre de priorité des connecteurs est : ¬, ∧, ∨, →, ↔.<\/li><li>L’associativité est à gauche pour chaque connecteur.<\/li><\/ul><\/div><\/article>", "sourceSlides": [14]}, {"title": "Sémantique", "html": "<article class=\"card lessonblock\"><h3>Sémantique<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Le contexte d’une formule est une application qui à chacune des variables présente associe la valeur 0 ou 1.<\/li><li>À tout contexte correspond une évaluation de la formule, définie inductivement par les tables de vérité associées aux opérateurs logiques.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Exemple: Une table de vérité permet d’associer à chaque contexte la valeur de la formule logique (ici ¬b ⇒ a ∧ ¬b) :<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>On peut enrichir le langage par de nouveaux opérateurs, en précisant leur table de vérité.<\/li><li>C’est le cas des opérateurs XOR, NAND et NOR :<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Tables de vérité<\/h3><div class=\"basictruthgrid\"><section class=\"truthbasic\"><h4>Négation : non (¬)<\/h4><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>¬p<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"truthbasic\"><h4>Disjonction : ou (∨)<\/h4><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ∨ q<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"truthbasic\"><h4>Conjonction : et (∧)<\/h4><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ∧ q<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/section><\/div><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>a<\/th><th>b<\/th><th>a → b<\/th><th>a ↔ b<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><div class=\"scroll\"><table><thead><tr><th>a<\/th><th>b<\/th><th>¬b<\/th><th>a ∧ ¬b<\/th><th>¬b → (a ∧ ¬b)<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article><article class=\"card lessonblock\"><h3>XOR, NAND et NOR<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>a<\/th><th>b<\/th><th>a XOR b<\/th><th>a NAND b<\/th><th>a NOR b<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>1<\/td><\/tr><tr><td>0<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>0<\/td><td>1<\/td><td>1<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr><\/tbody><\/table><\/div><ul class=\"lessonpoints\"><li>XOR est vrai si les entrées diffèrent.<\/li><li>NAND est la négation de ∧.<\/li><li>NOR est la négation de ∨.<\/li><\/ul><\/div><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Proposition&quot;, &quot;Énoncé auquel on peut attribuer V ou F.&quot;], [&quot;Syntaxe&quot;, &quot;Règles de construction des formules.&quot;], [&quot;Sémantique&quot;, &quot;Interprétation et valeur des formules.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>", "sourceSlides": [15, 16, 17]}]}, {"title": "Connecteurs et variables propositionnelles", "slides": [{"title": "Logique Formelle", "blocks": ["Chapitre 2 : Connecteurs \n            et variables propositionnelles"]}, {"title": "Logique Propositionnelle", "blocks": ["Les éléments de base de la logique propositionnelles sont les propositions\n\nUne proposition (ou énoncé) est une phrase declarative qui est soit vraie, soit fausse, mais pas les deux.\n\nDans la logique des propositions, les opérations qui lient les propositions pour en former d’autres plus complexes sont appelées des connecteurs,\nUn connecteur binaire permet de composer deux propositions pour en obtenir une troisième,\nUn connecteur unaire permet d’obtenir une proposition à partir d’une autre.\n"]}, {"title": "Exemples de propositions", "blocks": ["2 + 3 = 5\n5 − 2 = 1\nToday is Friday\n𝑥  + 3 = 7 ,\tpour 𝑥 = 4\nle triangle ABC est rectangle en A\nABCD est un rectangle\nTu auras ton examen si tu travailles régulièrement.\n136 est un multiple de 17 \n136 est un multiple de 17 ou 2 divise 167"]}, {"title": "Logique Propositionnelle", "blocks": ["En théorie, on fait référence à une proposition, sans la préciser, en lui associant simplement un symbole ou identificateur. Ainsi, on parlera des propositions p,q,r,··· \n\nÀ toute proposition p, on associe une valeur de vérité, désignée par la lettre V si p est vraie et par F si elle est fausse.\n\nUne proposition composée est une proposition formée par d’autres propositions reliées entre elles à l’aide de connecteurs logiques. Une proposition primitive est une proposition qui n’est pas composée.\n\nL’exclamation « vas-y ! » n’est pas une proposition logique puisque l’on ne peut lui attacher une valeur de vérité. \n\nLa phrase « Louis XIV était un grand roi » n’est pas une proposition car elle est entachée d’ambiguïté. En fait, c’est une opinion, affirmative pour les uns, négative pour d’autres. "]}, {"title": "Logique Propositionnelle", "blocks": ["La phrase « x = 3 » n’est pas, non plus, une proposition car on ne sait si elle est vraie ou fausse, aucune valeur n’étant attachée à x. \n\nLa proposition « 1+1 = 3 » est une proposition primitive qui est fausse alors que la proposition « 1+1 = 2 » est une proposition primitive qui est vraie. La valeur de vérité associée à la première est F alors que celle qui est associée à la seconde est V. \n\nLa phrase « le ciel est bleu et la terre est ocre » est une proposition composée car elle est formée de deux primitives « le ciel est bleu » et « la terre est ocre », toutes deux reliées à l’aide de la conjonction et. \n\nLa phrase « si 1 = 0 alors le sel fleurit » est une proposition composée de deux propositions primitives « 1 = 0 » et « le sel fleurit », reliées à l’aide de l’adverbe alors."]}, {"title": "Logique Propositionnelle", "blocks": ["La valeur de vérité d’une proposition composée dépend donc exclusivement des valeurs de vérité des propositions primitives qui la composent. \n\nAinsi, si la valeur de vérité de chaque proposition primitive est connue, alors on est en mesure de connaître la valeur de vérité de la proposition composée. \n\nUn moyen simple pour calculer la valeur de vérité d’une proposition composée est d’établir sa table de vérité.", "Il n’est pas facile de calculer la table de vérité d’une proposition composée lorsqu’elle met en jeu un grand nombre de propositions primitives. \n\nEn effet, une seule proposition primitive demande deux lignes pour ses deux valeurs de vérité possibles, comme dans le cas de la négation. Quand la proposition composée met en jeu deux propositions primitives alors quatre lignes sont nécessaires. \n\nLorsque la proposition composée met en jeu n propositions primitives alors la table de vérité totalise 2n lignes"]}, {"title": "Connecteurs", "blocks": ["Ils existent cinq (5) connecteurs logiques, à la base de tout raisonnement mathématique. Soient P et Q deux propositions.", "La négation “non” ou ¬", "Nous appellerons la négation de p, la proposition (non p)(not p) et qui sera notée sous forme formalisée ¬p et définie ainsi : si p est vraie alors ¬p est fausse; et si p est fausse alors ¬p est vraie\n", "Table de vérité de la négation"]}, {"title": "Connecteurs", "blocks": ["Soit p la proposition primitive « 1 = 0 » et q la proposition primitive « 1 = 1 ». La proposition ¬p est donc la proposition « 1 <> 0 » qui est vraie alors que p est fausse. ", "Négation de la négation", "En général, une double négation vient souvent renforcer la négation tel que : voulez-vous sortir ? non, non. \n\nEn logique et en Mathématique, une double négation est considérée comme une affirmation", "Le 05 est non pair donc 05 est impair"]}, {"title": "Connecteurs", "blocks": [" Conjonction  “et” ou “∧”", "Nous appellerons conjonction de P et Q, la proposition (P et Q) (P and Q) et qui sera notée P ∧ Q et définie ainsi : si p et q sont vraies alors p∧q est vraie; sinon p∧q est fausse", "Table de vérité de la conjonction"]}, {"title": "Connecteurs", "blocks": ["P : La terre est ronde (vraie) et Q : Le ciel est bleu vraie). P et Q ou P ∧ Q se lit donc :La terre est ronde ET le ciel est bleu  P ∧ Q est vraie. Nous dirons que la proposition P ∧ Q est fausse lorsque l'une au moins des deux propositions est fausse. Ainsi : La terre est ronde ET le ciel est vert est une proposition fausse", " Disjonction  “ou” ou “∨”", "Nous appellerons disjonction de P et Q, la proposition (P ou Q) et qui sera notée P ∨ Q et définie ainsi : si p et q sont fausses alors p ∨ q est fausse; sinon p ∨ q est vraie.", "Table de vérité de la disjonction"]}, {"title": "Connecteurs", "blocks": ["En logique, le « ou » est non-exclusif, c'est à dire qu'il comprend la possibilité que les deux propositions soient vraies. Ainsi la proposition xy = 0 équivaut à la proposition x = 0 ou y = 0  elle est vraie quand l'un des deux nombres est nul, elle est aussi vraie quand les deux sont nuls.", "Lorsqu’une proposition composée met en jeu un nombre important de propositions primitives reliées entre elles à l’aide de connecteurs logiques, on peut être amené à faire des erreurs dans l’établissement de sa valeur de vérité. Pour dissiper tout malentendu, on utilise des parenthèses destinées à préciser l’ordre des opérations. \nComme pour les opérations usuelles, il y a un ordre de priorité qui régit les trois opérations logiques définies : d’abord la négation puis la conjonction et enfin la disjonction (observer l’analogie avec le moins unaire, la multiplication et l’addition). Ainsi, en l’absence de parenthèses, la proposition composée    ¬p ∨ q ∧ p est identique à (¬p) ∨ (q ∧ p)."]}, {"title": "Connecteurs", "blocks": ["Les propositions composées P = (¬p∧q)∨ p et Q = ¬p∧(q∨ p) n’ont pas la même valeur de vérité. Pour le voir, il suffit de construire la table de vérité de chacune des deux propositions et de comparer la dernière colonne de chacune des deux tables"]}, {"title": "Connecteurs", "blocks": ["Une tautologie (resp. contradiction) est une proposition composée qui est vraie (resp. fausse) quelles que soient les valeurs de vérité des propositions primitives qui la composent", "La proposition ¬p∨ p est une tautologie et la proposition ¬p∧ p est une contradiction. On peut vérifier cela à l’aide des tables de vérité."]}, {"title": "Connecteurs", "blocks": [" Propositions conditionnelles ou Implication →", "P → Q est une proposition qui se nomme implication et que nous pouvons lire de  différentes façons :\nSi P alors Q, \nPour que P il faut Q, \nPour que Q il suffit P\nP est une condition suffisante pour Q\nQ est une condition nécessaire de P.", "Soient p et q deux propositions primitives. La proposition conditionnelle (ou implication) notée p → q est la proposition qui est fausse seulement lorsque p est vraie et q est fausse. La proposition primitive p est, dans ce cas, appelée hypothèse (ou prémisse ou antécédent) et la proposition primitive q est appelée conclusion. "]}, {"title": "Connecteurs", "blocks": ["Table de vérité de la Proposition conditionnelle", "Soient les deux propositions primitives: \np =  il fait beau \nq = je vais à la plage", "   La proposition conditionnelle p → q est la proposition : \n   Si     il fait beau    alors        je vais à la plage", "     ou bien : il fait beau  implique    je vais à la plage"]}, {"title": "Connecteurs", "blocks": ["L’implication p → q est fausse seulement lorsque le temps et beau et je ne vais pas à la plage. Dans tous les autres cas, elle est vraie. Observons que l’implication reste vraie lorsque je vais à la plage par mauvais temps.", "L’implication est la moins prioritaire. Autrement dit, l’ordre de précédence des opérations de base est : ¬,∧,∨,→. Par conséquent, la proposition p∧q∨ ¬r → p∨r n’est pas ambiguë et doit être lue : ((p∧q)∨(¬r)) → (p∨r).", "La réciproque de la proposition conditionnelle p → q est la proposition q → p. La contraposée de la proposition conditionnelle p → q est la proposition ¬q → ¬p.", "Considérons les deux propositions de l’exemple précédent. La réciproque de la proposition p → q est la proposition : si « je vais à la plage » alors « il fait beau ». La contraposée de p → q est la proposition : si « je ne vais à la plage » alors « il ne fait pas beau »."]}, {"title": "Connecteurs", "blocks": [" Propositions biconditionnelles ou Équivalence ↔ ", "Soient p et q deux propositions primitives. La proposition biconditionnelle notée p ↔ q (qui se lit p si et seulement si q) est la proposition qui est vraie lorsque p et q ont même valeur de vérité et qui est fausse sinon. ", "Nous pourrons l'exprimer comme suit : \nP est équivalent à Q, \nPour P, il faut et il suffit Q, \nP est une condition nécessaire et suffisante pour Q,\nP si et seulement si Q.", "Table de vérité de la Proposition biconditionnelle"]}, {"title": "Connecteurs", "blocks": ["Prenons p = « 2 est impair » et q = « 3 est pair ». La proposition p ↔ q = « 2 est impair si et seulement si 3 est pair » est vraie car chacune des deux propositions p et q est fausse. Prenons maintenant p = « 2 est impair » et q = « 3 est impair ». La proposition p ↔ q = « 2 est impair si et seulement si 3 est impair » est fausse car p et q n’ont pas même valeur de vérité."]}, {"title": " Conditions nécessaires et suffisantes", "blocks": ["On considère P et Q deux propositions (par exemple : \"x est un nombre pair\", \"ABCD est un parallélogramme\", \"AB=BC\",...). On dit que :\nQ est une condition nécessaire pour avoir P si dès que P \n       est vraie, alors nécessairement, forcément, obligatoirement \n       Q est vraie.\nQ est une condition suffisante pour avoir P s'il suffit que Q    \n      soit vraie pour que P soit vraie.\n", "Exemple : On considère la proposition \"ABCD est un losange\".\n\"ABCD est un parallélogramme\" est une condition nécessaire pour que ABCD soit un losange : si ABCD est un losange, nécessairement ABCD est un parallélogramme. Le contraire (la réciproque) est faux : il existe des parallélogrammes qui ne sont pas des losanges. La condition n'est pas suffisante.\n\"ABCD est un carré\" est une condition suffisante pour que ABCD soit un losange. Dès que l'on sait que ABCD est un carré, on sait que ABCD est un losange, le contraire étant bien évidemment faux."]}, {"title": " Conditions nécessaires et suffisantes", "blocks": ["Lorsqu'une condition est à la fois nécessaire et suffisante, on dit que c'est une condition nécessaire et suffisante, et on est autorisé à employer la formule magique : \"si et seulement si\". Par exemple, la condition \"Les diagonales de ABCD se coupent en leur milieu, et sont perpendiculaires\" est une condition nécessaire et suffisante pour que ABCD soit un losange. Pour que ABCD soit un losange, il faut, et il suffit, que ses diagonales se coupent en leur milieu et soient perpendiculaires. En d'autres termes, un quadrilatère est un losange si, et seulement si, ses diagonales se coupent en leur milieu et sont perpendiculaires."]}, {"title": " OU exclusif", "blocks": ["La fonction OU exclusif, souvent appelé XOR (eXclusive OR), est un opérateur logique de l'algèbre de Boole. \n\nLa sortie a pour valeur « vrai » lorsqu'une des deux entrées, mais non les deux, a pour valeur « vrai »."]}], "topics": [{"title": "Logique Propositionnelle", "html": "<article class=\"card lessonblock\"><h3>Définition et connecteurs<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Il existe cinq connecteurs logiques de base : ¬, ∧, ∨, → et ↔.<\/li><li>Soient P et Q deux propositions.<\/li><li>Les éléments de base de la logique propositionnelles sont les propositions<\/li><\/ul><ul class=\"lessonpoints\"><li>Une proposition (ou énoncé) est une phrase declarative qui est soit vraie, soit fausse, mais pas les deux.<\/li><\/ul><ul class=\"lessonpoints\"><li>Dans la logique des propositions, les opérations qui lient les propositions pour en former d’autres plus complexes sont appelées des connecteurs, Un connecteur binaire permet de composer deux propositions pour en obtenir une troisième, Un connecteur unaire permet d’obtenir une proposition à partir d’une autre.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Exemples de propositions<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>2 + 3 = 5<\/li><li>5 − 2 = 1<\/li><li>Today is Friday<\/li><li>𝑥  + 3 = 7 ,\tpour 𝑥 = 4<\/li><li>le triangle&#160;ABC&#160;est rectangle en&#160;A<\/li><li>ABCD est un rectangle<\/li><li>Tu auras ton examen si tu travailles régulièrement.<\/li><li>136 est un multiple de 17&#160;<\/li><li>136 est un multiple de 17 ou 2 divise 167<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Symboles et propositions primitives<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>En théorie, on fait référence à une proposition, sans la préciser, en lui associant simplement un symbole ou identificateur.<\/li><li>Ainsi, on parlera des propositions p,q,r,···<\/li><\/ul><ul class=\"lessonpoints\"><li>À toute proposition p, on associe une valeur de vérité, désignée par la lettre V si p est vraie et par F si elle est fausse.<\/li><\/ul><ul class=\"lessonpoints\"><li>Une proposition composée est une proposition formée par d’autres propositions reliées entre elles à l’aide de connecteurs logiques.<\/li><li>Une proposition primitive est une proposition qui n’est pas composée.<\/li><\/ul><ul class=\"lessonpoints\"><li>L’exclamation « vas-y ! » n’est pas une proposition logique puisque l’on ne peut lui attacher une valeur de vérité.<\/li><\/ul><ul class=\"lessonpoints\"><li>La phrase « Louis XIV était un grand roi » n’est pas une proposition car elle est entachée d’ambiguïté.<\/li><li>En fait, c’est une opinion, affirmative pour les uns, négative pour d’autres.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Propositions composées<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La phrase « x = 3 » n’est pas, non plus, une proposition car on ne sait si elle est vraie ou fausse, aucune valeur n’étant attachée à x.<\/li><\/ul><ul class=\"lessonpoints\"><li>La proposition « 1+1 = 3 » est une proposition primitive qui est fausse alors que la proposition « 1+1 = 2 » est une proposition primitive qui est vraie.<\/li><li>La valeur de vérité associée à la première est F alors que celle qui est associée à la seconde est V.<\/li><\/ul><ul class=\"lessonpoints\"><li>La phrase « le ciel est bleu et la terre est ocre » est une proposition composée car elle est formée de deux primitives « le ciel est bleu » et « la terre est ocre », toutes deux reliées à l’aide de la conjonction et.<\/li><\/ul><ul class=\"lessonpoints\"><li>La phrase « si 1 = 0 alors le sel fleurit » est une proposition composée de deux propositions primitives « 1 = 0 » et « le sel fleurit », reliées à l’aide de l’adverbe alors.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Calculer une valeur de vérité<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La valeur de vérité d’une proposition composée dépend donc exclusivement des valeurs de vérité des propositions primitives qui la composent.<\/li><\/ul><ul class=\"lessonpoints\"><li>Ainsi, si la valeur de vérité de chaque proposition primitive est connue, alors on est en mesure de connaître la valeur de vérité de la proposition composée.<\/li><\/ul><ul class=\"lessonpoints\"><li>Un moyen simple pour calculer la valeur de vérité d’une proposition composée est d’établir sa table de vérité.<\/li><\/ul><ul class=\"lessonpoints\"><li>Il n’est pas facile de calculer la table de vérité d’une proposition composée lorsqu’elle met en jeu un grand nombre de propositions primitives.<\/li><\/ul><ul class=\"lessonpoints\"><li>En effet, une seule proposition primitive demande deux lignes pour ses deux valeurs de vérité possibles, comme dans le cas de la négation.<\/li><li>Quand la proposition composée met en jeu deux propositions primitives alors quatre lignes sont nécessaires.<\/li><\/ul><ul class=\"lessonpoints\"><li>Lorsque la proposition composée met en jeu n propositions primitives alors la table de vérité totalise 2ⁿ lignes<\/li><\/ul><\/div><\/article>", "sourceSlides": [1, 2, 3, 4, 5, 6]}, {"title": "La négation “non” ou ¬", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La négation “non” ou ¬<\/li><\/ul><ul class=\"lessonpoints\"><li>Nous appellerons la négation de p, la proposition (non p)(not p) et qui sera notée sous forme formalisée ¬p et définie ainsi : si p est vraie alors ¬p est fausse<\/li><li>et si p est fausse alors ¬p est vraie<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Soit p la proposition primitive « 1 = 0 » et q la proposition primitive « 1 = 1 ».<\/li><li>La proposition ¬p est donc la proposition « 1 &lt;&gt; 0 » qui est vraie alors que p est fausse.<\/li><\/ul><ul class=\"lessonpoints\"><li>Négation de la négation<\/li><\/ul><ul class=\"lessonpoints\"><li>En général, une double négation vient souvent renforcer la négation tel que : voulez-vous sortir ? non, non.<\/li><\/ul><ul class=\"lessonpoints\"><li>En logique et en Mathématique, une double négation est considérée comme une affirmation<\/li><\/ul><ul class=\"lessonpoints\"><li>Le 05 est non pair donc 05 est impair<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>La négation et la double négation<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>¬p<\/th><th>¬¬p<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>F<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [7, 8]}, {"title": "Conjonction “et” ou “∧”", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Conjonction  “et” ou “∧”<\/li><\/ul><ul class=\"lessonpoints\"><li>Nous appellerons conjonction de P et Q, la proposition (P et Q) (P and Q) et qui sera notée P ∧ Q et définie ainsi : si p et q sont vraies alors p∧q est vraie<\/li><li>sinon p∧q est fausse<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Exemples<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>P : « La terre est ronde » (vraie).<\/li><li>Q : « Le ciel est bleu » (vraie).<\/li><li>P ∧ Q se lit : « La terre est ronde ET le ciel est bleu ». Cette conjonction est vraie puisque P et Q sont vraies.<\/li><li>P ∧ Q est fausse lorsqu’au moins une des deux propositions est fausse.<\/li><li>Ainsi, « La terre est ronde ET le ciel est vert » est fausse lorsque la proposition « Le ciel est vert » est fausse.<\/li><\/ul><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ∧ q<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [9]}, {"title": "Disjonction “ou” ou “∨”", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Disjonction  “ou” ou “∨”<\/li><\/ul><ul class=\"lessonpoints\"><li>Nous appellerons disjonction de P et Q, la proposition (P ou Q) et qui sera notée P ∨ Q et définie ainsi : si p et q sont fausses alors p ∨ q est fausse<\/li><li>sinon p ∨ q est vraie.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>En logique, le « ou » est non-exclusif, c'est à dire qu'il comprend la possibilité que les deux propositions soient vraies.<\/li><li>Ainsi la proposition xy = 0 équivaut à la proposition x = 0 ou y = 0 elle est vraie quand l'un des deux nombres est nul, elle est aussi vraie quand les deux sont nuls.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Table de vérité de la disjonction<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ∨ q<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [10, 11]}, {"title": "Tautologie et contradiction", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Une tautologie (resp. contradiction) est une proposition composée qui est vraie (resp. fausse) quelles que soient les valeurs de vérité des propositions primitives qui la composent<\/li><\/ul><ul class=\"lessonpoints\"><li>La proposition ¬p∨ p est une tautologie et la proposition ¬p∧ p est une contradiction.<\/li><li>On peut vérifier cela à l’aide des tables de vérité.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Deux comportements opposés<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>¬p<\/th><th>¬p ∨ p<\/th><th>¬p ∧ p<\/th><\/tr><\/thead><tbody><tr><td>F<\/td><td>V<\/td><td>V<\/td><td>F<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>V<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [13]}, {"title": "Propositions conditionnelles ou Implication →", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Propositions conditionnelles ou Implication →<\/li><\/ul><ul class=\"lessonpoints\"><li>P → Q est une proposition appelée implication. Elle peut se lire de différentes façons :<ul class=\"implication-readings\"><li>Si P, alors Q.<\/li><li>Pour que P, il faut Q.<\/li><li>Pour que Q, il suffit P.<\/li><li>P est une condition suffisante pour Q.<\/li><li>Q est une condition nécessaire pour P.<\/li><\/ul><\/li><\/ul><ul class=\"lessonpoints\"><li>Soient p et q deux propositions primitives.<\/li><li>La proposition conditionnelle (ou implication) notée p → q est la proposition qui est fausse seulement lorsque p est vraie et q est fausse.<\/li><li>La proposition primitive p est, dans ce cas, appelée hypothèse (ou prémisse ou antécédent) et la proposition primitive q est appelée conclusion.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Soient les deux propositions primitives:  p =  il fait beau  q = je vais à la plage<\/li><\/ul><ul class=\"lessonpoints\"><li>La proposition conditionnelle p → q est la proposition :     Si     il fait beau    alors        je vais à la plage<\/li><\/ul><ul class=\"lessonpoints\"><li>ou bien : il fait beau  implique    je vais à la plage<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>L’implication p → q est fausse seulement lorsque le temps et beau et je ne vais pas à la plage.<\/li><li>Dans tous les autres cas, elle est vraie.<\/li><li>Observons que l’implication reste vraie lorsque je vais à la plage par mauvais temps.<\/li><\/ul><ul class=\"lessonpoints\"><li>La réciproque de la proposition conditionnelle p → q est la proposition q → p.<\/li><li>La contraposée de la proposition conditionnelle p → q est la proposition ¬q → ¬p.<\/li><\/ul><ul class=\"lessonpoints\"><li>Considérons les deux propositions de l’exemple précédent.<\/li><li>La réciproque de la proposition p → q est la proposition : si « je vais à la plage » alors « il fait beau ».<\/li><li>La contraposée de p → q est la proposition : si « je ne vais à la plage » alors « il ne fait pas beau ».<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Table de vérité de l’implication<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p → q<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>F<\/td><td>V<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [14, 15, 16]}, {"title": "Propositions biconditionnelles ou Équivalence ↔", "html": "<article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Propositions biconditionnelles ou Équivalence ↔<\/li><\/ul><ul class=\"lessonpoints\"><li>Soient p et q deux propositions primitives.<\/li><li>La proposition biconditionnelle notée p ↔ q (qui se lit p si et seulement si q) est la proposition qui est vraie lorsque p et q ont même valeur de vérité et qui est fausse sinon.<\/li><\/ul><ul class=\"lessonpoints\"><li>Nous pourrons l’exprimer comme suit :<ul class=\"implication-readings\"><li>P est équivalent à Q.<\/li><li>Pour P, il faut et il suffit Q.<\/li><li>P est une condition nécessaire et suffisante pour Q.<\/li><li>P si et seulement si Q.<\/li><\/ul><\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Prenons p = « 2 est impair » et q = « 3 est pair ».<\/li><li>La proposition p ↔ q = « 2 est impair si et seulement si 3 est pair » est vraie car chacune des deux propositions p et q est fausse.<\/li><li>Prenons maintenant p = « 2 est impair » et q = « 3 est impair ».<\/li><li>La proposition p ↔ q = « 2 est impair si et seulement si 3 est impair » est fausse car p et q n’ont pas même valeur de vérité.<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Table de vérité de l’équivalence<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ↔ q<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>F<\/td><td>V<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article>", "sourceSlides": [17, 18]}, {"title": "Parenthèses et priorités", "html": "<article class=\"card lessonblock\"><h3>Priorité des cinq connecteurs<\/h3><p>De la priorité la plus forte à la plus faible :<\/p><ul class=\"lessonpoints\"><li><strong>¬ — Négation (non)<\/strong> : priorité la plus forte.<\/li><li><strong>∧ — Conjonction (et)<\/strong>.<\/li><li><strong>∨ — Disjonction (ou)<\/strong>.<\/li><li><strong>→ — Implication<\/strong>.<\/li><li><strong>↔ — Équivalence<\/strong> : priorité la plus faible.<\/li><\/ul><p class=\"formula\">¬ &gt; ∧ &gt; ∨ &gt; → &gt; ↔<\/p><ul class=\"lessonpoints\"><li>Les parenthèses sont prioritaires : on traite d’abord la formule qu’elles encadrent.<\/li><li>À priorité égale, la convention retenue ici est une lecture de gauche à droite. Des parenthèses permettent de préciser le regroupement.<\/li><li>Exemple : ¬p ∨ q ∧ r → s ↔ t se lit (((¬p) ∨ (q ∧ r)) → s) ↔ t.<\/li><\/ul><\/article><article class=\"card lessonblock\"><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Par conséquent, la proposition p∧q∨ ¬r → p∨r n’est pas ambiguë et doit être lue : ((p∧q)∨(¬r)) → (p∨r).<\/li><li>Lorsqu’une proposition composée met en jeu un nombre important de propositions primitives reliées entre elles à l’aide de connecteurs logiques, on peut être amené à faire des erreurs dans l’établissement de sa valeur de vérité.<\/li><li>Pour dissiper tout malentendu, on utilise des parenthèses destinées à préciser l’ordre des opérations.<\/li><li>Ainsi, en l’absence de parenthèses, la proposition composée ¬p ∨ q ∧ p est identique à (¬p) ∨ (q ∧ p).<\/li><li>Les propositions composées P = (¬p∧q)∨ p et Q = ¬p∧(q∨ p) n’ont pas la même valeur de vérité.<\/li><li>Pour le voir, il suffit de construire la table de vérité de chacune des deux propositions et de comparer la dernière colonne de chacune des deux tables<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Comparer les deux expressions<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>(¬p ∧ q) ∨ p<\/th><th>¬p ∧ (q ∨ p)<\/th><\/tr><\/thead><tbody><tr><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>V<\/td><td>F<\/td><\/tr><tr><td>V<\/td><td>V<\/td><td>V<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><ul class=\"lessonpoints\"><li>Avec p = V, les deux expressions diffèrent.<\/li><\/ul><\/div><\/article>", "sourceSlides": [12]}, {"title": "Conditions nécessaires et suffisantes", "html": "<article class=\"card lessonblock\"><h3>Conditions nécessaires et suffisantes<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>On considère P et Q deux propositions (par exemple : \"x est un nombre pair\", \"ABCD est un parallélogramme\", \"AB=BC\",...).<\/li><li>On dit que : Q est une condition nécessaire pour avoir P si dès que P est vraie, alors nécessairement, forcément, obligatoirement Q est vraie.<\/li><li>Q est une condition suffisante pour avoir P s'il suffit que Q soit vraie pour que P soit vraie.<\/li><\/ul><ul class=\"lessonpoints\"><li>Exemple : On considère la proposition \"ABCD est un losange\". \"ABCD est un parallélogramme\" est une condition nécessaire pour que ABCD soit un losange : si ABCD est un losange, nécessairement ABCD est un parallélogramme.<\/li><li>Le contraire (la réciproque) est faux : il existe des parallélogrammes qui ne sont pas des losanges.<\/li><li>La condition n'est pas suffisante. \"ABCD est un carré\" est une condition suffisante pour que ABCD soit un losange.<\/li><li>Dès que l'on sait que ABCD est un carré, on sait que ABCD est un losange, le contraire étant bien évidemment faux.<\/li><\/ul><\/div><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>Lorsqu'une condition est à la fois nécessaire et suffisante, on dit que c'est une condition nécessaire et suffisante, et on est autorisé à employer la formule magique : \"si et seulement si\".<\/li><li>Par exemple, la condition \"Les diagonales de ABCD se coupent en leur milieu, et sont perpendiculaires\" est une condition nécessaire et suffisante pour que ABCD soit un losange.<\/li><li>Pour que ABCD soit un losange, il faut, et il suffit, que ses diagonales se coupent en leur milieu et soient perpendiculaires.<\/li><li>En d'autres termes, un quadrilatère est un losange si, et seulement si, ses diagonales se coupent en leur milieu et sont perpendiculaires.<\/li><\/ul><\/div><\/article>", "sourceSlides": [19, 20]}, {"title": "OU exclusif", "html": "<article class=\"card lessonblock\"><h3>OU exclusif<\/h3><div class=\"lessonparagraph\"><ul class=\"lessonpoints\"><li>La fonction&#160;OU exclusif, souvent appelé&#160;XOR&#160;(eXclusive&#160;OR), est un opérateur logique de l'algèbre de Boole.<\/li><\/ul><ul class=\"lessonpoints\"><li>La sortie a pour valeur « vrai » lorsqu'une des deux entrées, mais non les deux, a pour valeur « vrai ».<\/li><\/ul><\/div><\/article><article class=\"card lessonblock\"><h3>Comparer OU et XOR<\/h3><div class=\"lessonparagraph\"><div class=\"scroll\"><table><thead><tr><th>p<\/th><th>q<\/th><th>p ∨ q<\/th><th>p XOR q<\/th><\/tr><\/thead><tbody><tr><td>V<\/td><td>V<\/td><td>V<\/td><td>F<\/td><\/tr><tr><td>V<\/td><td>F<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>V<\/td><td>V<\/td><td>V<\/td><\/tr><tr><td>F<\/td><td>F<\/td><td>F<\/td><td>F<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;¬&quot;, &quot;Inverse la valeur de vérité.&quot;], [&quot;∧&quot;, &quot;Vrai lorsque les deux propositions sont vraies.&quot;], [&quot;∨&quot;, &quot;Vrai lorsqu’au moins une proposition est vraie.&quot;], [&quot;→&quot;, &quot;Faux uniquement si l’antécédent est vrai et le conséquent faux.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>", "sourceSlides": [21]}]}, {"title": "Equivalence Logique Entre Formules", "slides": [{"title": "Logique Formelle", "blocks": ["Chapitre 3 : Equivalence Logique Entre    \nFormules"]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Deux formules logiques F1 et F2 sont dites logiquement équivalentes lorsque leurs évaluations coïncident dans tout contexte. On note alors : F1 ≡ F2. ", "Deux formules logiques F1 et F2 sont dites logiquement équivalentes lorsque leurs tables de vérité coïncident,", "Exemple: Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Equivalence Logique Entre Formules", "blocks": ["Montrer que ¬(p ∨ q)  et  ¬p  ∧ ¬q sont logiquement équivalentes "]}, {"title": "Lois de De Morgan", "blocks": ["La construction des tables de vérités permet de prouver sans peine les deux théorèmes suivants :\n    Théorème (De Morgan). — Si a et b sont deux variables propositionnelles, on dispose des équivalences suivantes : \n\n¬(a ∧ b) ≡ ¬a ∨ ¬b et ¬(a ∨ b) ≡ ¬a ∧ ¬b", "Ce théorème montre que l’opérateur de conjonction peut être défini à partir des opérateurs de négation et de disjonction à l’aide de la formule : a ∧ b ≡ ¬(¬a ∨ ¬b) et de même, l’opérateur de disjonction peut être défini à partir des opérateurs de négation et de conjonction : a ∨ b ≡ ¬(¬a ∧ ¬b).", "On dispose en outre des équivalences : (a → b) ≡ (¬a∨b)  \net \n(a ↔ b) ≡  ((a ⇒ b)∧(b ⇒ a))\nces deux théorèmes prouvent que toute formule logique est équivalente à une formule logique définie à l’aide des seuls connecteurs logiques ¬ \net ∧ (ou ¬ et ∨). On dit que {¬,∧} et {¬,∨} sont des systèmes complets de connecteurs logiques."]}, {"title": "Equivalence Logique", "blocks": []}, {"title": "Equivalence Logique", "blocks": []}, {"title": "Equivalence Logique", "blocks": []}, {"title": "Exercice", "blocks": ["Montrer que ¬(𝑝 ∨ (¬𝑝 ∧ 𝑞)) et  ¬𝑝 ∧ ¬𝑞 sont logiquement équivalentes (En appliquant les lois précédentes)"]}], "topics": [{"title": "Equivalence Logique Entre Formules", "sourceSlides": [2, 3, 4, 5, 6, 7], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Deux formules F₁ et F₂ sont logiquement équivalentes si leurs valeurs coïncident pour toute interprétation de leurs variables.<\/li><li>On note F₁ ≡ F₂. Leurs colonnes finales dans une même table de vérité sont identiques.<\/li><li>Vérifier une seule interprétation ne suffit pas pour prouver une équivalence. Un seul désaccord suffit pour la réfuter.<\/li><\/ul><section class=\"logicstudio\" data-logic=\"truth\"><div class=\"logicstudiohead\"><span>EXPLORER · MANIPULER · COMPRENDRE<\/span><h3>Deux formules, toutes les interprétations<\/h3><div class=\"logicgoal\"><b>Travail demandé<\/b><p>Montrer que ¬(p ∨ q) et ¬p ∧ ¬q sont équivalentes. Parcourir toutes les lignes, puis comparer avec une paire non équivalente.<\/p><\/div><\/div><div class=\"logicmount\"><\/div><\/section><\/article>"}, {"title": "Lois de De Morgan", "sourceSlides": [8], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>¬(a ∧ b) ≡ ¬a ∨ ¬b.<\/li><li>¬(a ∨ b) ≡ ¬a ∧ ¬b.<\/li><li>En passant une négation à travers les parenthèses, on échange ∧ et ∨ et on nie chaque opérande.<\/li><li>La conjonction peut s’écrire a ∧ b ≡ ¬(¬a ∨ ¬b).<\/li><li>La disjonction peut s’écrire a ∨ b ≡ ¬(¬a ∧ ¬b).<\/li><li>a → b ≡ ¬a ∨ b.<\/li><li>a ↔ b ≡ (a → b) ∧ (b → a).<\/li><li>Les ensembles {¬, ∧} et {¬, ∨} sont des systèmes complets de connecteurs : chaque formule peut être réécrite à l’aide de l’un de ces deux ensembles.<\/li><\/ul><section class=\"logicstudio\" data-logic=\"morgan\"><div class=\"logicstudiohead\"><span>EXPLORER · MANIPULER · COMPRENDRE<\/span><h3>Faire circuler la négation<\/h3><div class=\"logicgoal\"><b>Travail demandé<\/b><p>Choisir une loi, appliquer la transformation et changer les valeurs de p et q pour comparer les deux expressions.<\/p><\/div><\/div><div class=\"logicmount\"><\/div><\/section><\/article>"}, {"title": "Equivalence Logique", "sourceSlides": [9, 10, 11], "html": "<article class=\"lawsummary card\"><div class=\"summaryheader\"><span>FICHE DE SYNTHÈSE<\/span><h3>Toutes les lois d’équivalence<\/h3><p>13 familles · 29 équivalences · Un même principe : conserver la valeur de vérité.<\/p><\/div><div class=\"summarylegend\"><span><b>V<\/b> Vrai<\/span><span><b>F<\/b> Faux<\/span><span><b>≡<\/b> Équivalence dans toutes les interprétations<\/span><\/div><div class=\"summaryscroll\" tabindex=\"0\" role=\"region\" aria-label=\"Tableau récapitulatif des lois d’équivalence\"><table class=\"lawsummarytable\"><thead><tr><th scope=\"col\">Loi<\/th><th scope=\"col\">Équivalences à connaître<\/th><th scope=\"col\">À retenir<\/th><\/tr><\/thead><tbody><tr class=\"lawcolor0\"><th scope=\"row\"><span class=\"lawcategory\">Identité<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> V<\/span><b>≡<\/b><span>p<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> F<\/span><b>≡<\/b><span>p<\/span><\/div><\/td><td class=\"lawremark\">V est neutre pour ∧ ; F est neutre pour ∨.<\/td><\/tr><tr class=\"lawcolor1\"><th scope=\"row\"><span class=\"lawcategory\">Domination<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> V<\/span><b>≡<\/b><span>V<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> F<\/span><b>≡<\/b><span>F<\/span><\/div><\/td><td class=\"lawremark\">V impose V à une disjonction ; F impose F à une conjonction.<\/td><\/tr><tr class=\"lawcolor2\"><th scope=\"row\"><span class=\"lawcategory\">Idempotence<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> p<\/span><b>≡<\/b><span>p<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> p<\/span><b>≡<\/b><span>p<\/span><\/div><\/td><td class=\"lawremark\">Répéter une même proposition ne change pas sa valeur.<\/td><\/tr><tr class=\"lawcolor3\"><th scope=\"row\"><span class=\"lawcategory\">Double négation<\/span><\/th><td><div class=\"summaryidentity\"><span><span class=\"summaryop\">¬<\/span>(<span class=\"summaryop\">¬<\/span>p)<\/span><b>≡<\/b><span>p<\/span><\/div><\/td><td class=\"lawremark\">Deux négations successives restituent la valeur initiale.<\/td><\/tr><tr class=\"lawcolor0\"><th scope=\"row\"><span class=\"lawcategory\">Commutativité<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> q<\/span><b>≡<\/b><span>q <span class=\"summaryop\">∨<\/span> p<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> q<\/span><b>≡<\/b><span>q <span class=\"summaryop\">∧<\/span> p<\/span><\/div><\/td><td class=\"lawremark\">L’ordre des deux opérandes peut être échangé.<\/td><\/tr><tr class=\"lawcolor1\"><th scope=\"row\"><span class=\"lawcategory\">Associativité<\/span><\/th><td><div class=\"summaryidentity\"><span>(p <span class=\"summaryop\">∨<\/span> q) <span class=\"summaryop\">∨<\/span> r<\/span><b>≡<\/b><span>p <span class=\"summaryop\">∨<\/span> (q <span class=\"summaryop\">∨<\/span> r)<\/span><\/div><div class=\"summaryidentity\"><span>(p <span class=\"summaryop\">∧<\/span> q) <span class=\"summaryop\">∧<\/span> r<\/span><b>≡<\/b><span>p <span class=\"summaryop\">∧<\/span> (q <span class=\"summaryop\">∧<\/span> r)<\/span><\/div><\/td><td class=\"lawremark\">Avec un même connecteur, le regroupement peut être modifié.<\/td><\/tr><tr class=\"lawcolor2\"><th scope=\"row\"><span class=\"lawcategory\">Distribution<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> (q <span class=\"summaryop\">∧<\/span> r)<\/span><b>≡<\/b><span>(p <span class=\"summaryop\">∨<\/span> q) <span class=\"summaryop\">∧<\/span> (p <span class=\"summaryop\">∨<\/span> r)<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> (q <span class=\"summaryop\">∨<\/span> r)<\/span><b>≡<\/b><span>(p <span class=\"summaryop\">∧<\/span> q) <span class=\"summaryop\">∨<\/span> (p <span class=\"summaryop\">∧<\/span> r)<\/span><\/div><\/td><td class=\"lawremark\">Un connecteur se distribue sur l’autre ; le terme p apparaît dans les deux facteurs.<\/td><\/tr><tr class=\"lawcolor3\"><th scope=\"row\"><span class=\"lawcategory\">De Morgan<\/span><\/th><td><div class=\"summaryidentity\"><span><span class=\"summaryop\">¬<\/span>(p <span class=\"summaryop\">∧<\/span> q)<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∨<\/span> <span class=\"summaryop\">¬<\/span>q<\/span><\/div><div class=\"summaryidentity\"><span><span class=\"summaryop\">¬<\/span>(p <span class=\"summaryop\">∨<\/span> q)<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∧<\/span> <span class=\"summaryop\">¬<\/span>q<\/span><\/div><\/td><td class=\"lawremark\">Échanger ∧ et ∨ et nier chaque opérande.<\/td><\/tr><tr class=\"lawcolor0\"><th scope=\"row\"><span class=\"lawcategory\">Absorption<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> (p <span class=\"summaryop\">∧<\/span> q)<\/span><b>≡<\/b><span>p<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> (p <span class=\"summaryop\">∨<\/span> q)<\/span><b>≡<\/b><span>p<\/span><\/div><\/td><td class=\"lawremark\">La proposition p absorbe le terme qui la contient.<\/td><\/tr><tr class=\"lawcolor1\"><th scope=\"row\"><span class=\"lawcategory\">Négation<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> <span class=\"summaryop\">¬<\/span>p<\/span><b>≡<\/b><span>V<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> <span class=\"summaryop\">¬<\/span>p<\/span><b>≡<\/b><span>F<\/span><\/div><\/td><td class=\"lawremark\">Une proposition ou sa négation est toujours vraie ; leur conjonction est toujours fausse.<\/td><\/tr><tr class=\"lawcolor2\"><th scope=\"row\"><span class=\"lawcategory\">Implication<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">→<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∨<\/span> q<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">→<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>q <span class=\"summaryop\">→<\/span> <span class=\"summaryop\">¬<\/span>p<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">→<\/span> q<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>(p <span class=\"summaryop\">→<\/span> <span class=\"summaryop\">¬<\/span>q)<\/span><\/div><\/td><td class=\"lawremark\">Réécrire une implication, utiliser sa contraposée ou exprimer ∨ et ∧ à l’aide de →.<\/td><\/tr><tr class=\"lawcolor3\"><th scope=\"row\"><span class=\"lawcategory\">Équivalence<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">↔<\/span> q<\/span><b>≡<\/b><span>(p <span class=\"summaryop\">→<\/span> q) <span class=\"summaryop\">∧<\/span> (q <span class=\"summaryop\">→<\/span> p)<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">↔<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">↔<\/span> <span class=\"summaryop\">¬<\/span>q<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">↔<\/span> q<\/span><b>≡<\/b><span>(p <span class=\"summaryop\">∧<\/span> q) <span class=\"summaryop\">∨<\/span> (<span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∧<\/span> <span class=\"summaryop\">¬<\/span>q)<\/span><\/div><div class=\"summaryidentity\"><span><span class=\"summaryop\">¬<\/span>(p <span class=\"summaryop\">↔<\/span> q)<\/span><b>≡<\/b><span>p <span class=\"summaryop\">↔<\/span> <span class=\"summaryop\">¬<\/span>q<\/span><\/div><\/td><td class=\"lawremark\">Une équivalence est vraie lorsque les deux opérandes ont la même valeur.<\/td><\/tr><tr class=\"lawcolor0\"><th scope=\"row\"><span class=\"lawcategory\">Systèmes complets de connecteurs<\/span><\/th><td><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∧<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>(<span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∨<\/span> <span class=\"summaryop\">¬<\/span>q)<\/span><\/div><div class=\"summaryidentity\"><span>p <span class=\"summaryop\">∨<\/span> q<\/span><b>≡<\/b><span><span class=\"summaryop\">¬<\/span>(<span class=\"summaryop\">¬<\/span>p <span class=\"summaryop\">∧<\/span> <span class=\"summaryop\">¬<\/span>q)<\/span><\/div><\/td><td class=\"lawremark\">Toute formule peut être exprimée avec {¬, ∧} ou avec {¬, ∨}.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"summaryfoot\">Les lettres p, q et r peuvent être remplacées uniformément par des formules. Utiliser les parenthèses pour préserver leur structure.<\/div><\/article><article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Les lois d’équivalence permettent de remplacer une sous-formule par une formule équivalente.<\/li><li>Chaque remplacement conserve la valeur de vérité dans toutes les interprétations.<\/li><li>V désigne Vrai et F désigne Faux.<\/li><\/ul><section class=\"logicstudio\" data-logic=\"laws\"><div class=\"logicstudiohead\"><span>EXPLORER · MANIPULER · COMPRENDRE<\/span><h3>Les lois, une famille à la fois<\/h3><div class=\"logicgoal\"><b>Travail demandé<\/b><p>Choisir une famille de lois. Comparer les formes équivalentes et modifier les variables pour observer leur valeur.<\/p><\/div><\/div><div class=\"logicmount\"><\/div><\/section><\/article>"}, {"title": "Exemple guidé", "sourceSlides": [12], "html": "<article class=\"card lessonblock\"><section class=\"logicstudio\" data-logic=\"proof\"><div class=\"logicstudiohead\"><span>EXPLORER · MANIPULER · COMPRENDRE<\/span><h3>Construire la démonstration<\/h3><div class=\"logicgoal\"><b>Travail demandé<\/b><p>Montrer, en appliquant les lois précédentes, que ¬(p ∨ (¬p ∧ q)) ≡ ¬p ∧ ¬q. Suivre les lois appliquées et observer chaque transformation commentée.<\/p><\/div><\/div><div class=\"logicmount\"><\/div><\/section><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Identité&quot;, &quot;p ∧ V ≡ p&quot;], [&quot;Double négation&quot;, &quot;¬¬p ≡ p&quot;], [&quot;De Morgan&quot;, &quot;¬(p ∨ q) ≡ ¬p ∧ ¬q&quot;], [&quot;Absorption&quot;, &quot;p ∨ (p ∧ q) ≡ p&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Interprétation de formules, Substitution, validité et inconsistance", "slides": [{"title": "Logique Formelle", "blocks": ["Chapitre 4 : Interprétation de formules, Substitution, validité et inconsistance   "]}, {"title": "Interprétation de formules", "blocks": ["Deux Une interprétation du calcul propositionnel consiste à donner : \n\n Domaine sémantique non vide D = {V, F} \n Valuation des atomes dans D \n Définition des connecteurs par des applications de D dans D pour ¬ et de D∗D dans D pour ∧, ∨, →, ↔. \n\nTout atome est vrai ou faux mais pas les deux à la fois \n\n\nUne interprétation I (ou valuation) est une application de l'ensemble des variables propositionnelles dans l'ensemble des valeurs de vérité {V,F} (ou {0,1}). \n\n\nDéfinition des connecteurs par des tables de vérité : "]}, {"title": "Interprétation de formules", "blocks": ["Pour une fbf G composée de différents atomes : A1...An, une interprétation de G est une assignation des valeurs de vérité à A1...An. \n\nG comporte n atomes ==> 2n    interprétations possibles"]}, {"title": "Interprétation de formules", "blocks": ["Exemple : G = (A ∨ B) ∧ C ==>  3 atomes différentes\n 2n = 8 interprétations possibles", "Une fbf G est vraie (respectivement fausse) dans une interprétation i si la valeur de G est vraie (respectivement fausse) On écrit i[G] = V (respectivement i[G]= F) "]}, {"title": "Interprétation de formules", "blocks": ["Une interprétation qui rend vraie une formule est un modèle de cette formule. On dit qu'une interprétation i est un modèle d'une formule F si la valeur de F selon l'interprétation i est vraie : i[F] = V dans ce cas on note i |= F. On dit que i est un modèle d'un ensemble de formules E si i est modèle de tout élément de E \n\nExemple: ", "G : (P → (Q ∨ (¬R))) Notation i1[P] se lit valeur de P selon l'interprétation i1 \nSoit i1 telle que: i1[P] = i1[R] = V\n i1[Q] = F \nG est fausse dans i1 \nSoit I2 telle que: i2[P] = i2[R] = F \ni2[Q] = V \nG est vraie dans i2 "]}, {"title": "Interprétation de formules", "blocks": ["Exercice: \nSoit I l’interprétation I[p] = V, I[q] = F. Calculer la valeur de vérité de la formule (p ∨ q) → ¬(q ∧ q) par rapport à I."]}, {"title": "Validité et Inconsistance ", "blocks": ["Une proposition est dite valide ou tautologique si et seulement si elle est vraie en toutes circonstances.\n\nUne fbf A est dite valide (A est une tautologie) si et seulement si elle est vraie dans toute interprétation; on écrit alors : |= A\n", "¬A ∨ A est une formule valide \n\nUne fbf est invalide si et seulement si elle n'est pas valide \nA ∧ B et A ∨ B sont deux formules invalides il suffit que A et B soient fausses ", "Pour vérifier qu'une proposition est valide,\nOn effectue une analyse sémantique (arbre de vérité, )\nsi l’on obtient :\n que des V à la fin du processus, la formule est valide; \n    c’est une tautologie.\n  un F (au moins), la formule n’est pas valide; ce n’est pas\n     une tautologie.\n"]}, {"title": "Validité et Inconsistance ", "blocks": ["Une fbf est inconsistante ou insatisfiable si et seulement si elle est fausse dans toute interprétation \n\n¬A ∧ A est une formule inconsistante\n\n Une fbf A est consistante ou satisfiable \nsi et seulement si elle n'est pas inconsistante\nsi il existe une interprétation i telle que i[A] = V \nsi elle admet un modèle \n\nA ∧ B et A ∨ B sont deux formules consistantes il suffit que A et B soient vraies"]}, {"title": "Validité et Inconsistance ", "blocks": ["Exemples propositions valides"]}, {"title": "Substitution", "blocks": ["Une substitution (ou substitution uniforme) associe à une variable propositionnelle p une formule A . Elle est notée [p\\A]. \nL'application de [p\\A] à une formule B , notée B[p\\A], est le résultat du remplacement simultané de toutes les occurrences de p dans B par A.\nB [p\\A], est appelé une instance de B.", "Exemple"]}, {"title": "Substitution", "blocks": ["Un schéma désigne n’importe quelle formule obtenue par substitution à partir d'une formule originelle"]}, {"title": "Substitution", "blocks": ["Si on opère une substitution dans une formule valide alors on obtient une formule valide => Les substitutions conservent la validité.", "Si un schéma est obtenu à partir d'une formule valide alors il est valide."]}], "topics": [{"title": "Interprétation de formules", "sourceSlides": [2, 3, 4, 5, 6], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Le domaine sémantique du calcul propositionnel est D = {V, F}, un ensemble non vide.<\/li><li>Une interprétation I associe une valeur V ou F à chaque variable propositionnelle. Un atome possède exactement une de ces deux valeurs.<\/li><li>La négation est une application de D dans D ; ∧, ∨, → et ↔ sont des applications de D × D dans D.<\/li><li>Une formule comportant n atomes distincts admet 2ⁿ interprétations. Ainsi G = (A ∨ B) ∧ C en admet 8.<\/li><li>I[G] = V signifie que G est vraie dans I ; I[G] = F signifie qu’elle est fausse.<\/li><li>I est un modèle de G si I[G] = V ; on note I ⊨ G.<\/li><li>I est un modèle d’un ensemble E si toutes les formules de E sont vraies dans I.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"interpret\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Faire circuler les valeurs dans une formule<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Changer les valeurs des atomes, puis suivre le calcul des sous-formules jusqu’au résultat. Les exemples du cours sont disponibles dans la liste.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article>"}, {"title": "Validité et Inconsistance", "sourceSlides": [7, 8, 9], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une formule est valide, ou tautologique, si elle est vraie dans toute interprétation : ⊨ A.<\/li><li>Une formule est invalide si elle possède au moins une in
