terprétation qui la rend fausse. Invalide ne signifie pas insatisfiable.<\/li><li>Une formule est inconsistante ou insatisfiable si elle est fausse dans toute interprétation : elle n’a aucun modèle.<\/li><li>Une formule est consistante ou satisfiable si elle possède au moins un modèle.<\/li><li>Une formule contingente possède au moins un modèle et au moins une interprétation qui la rend fausse.<\/li><li>¬A ∨ A est valide ; ¬A ∧ A est insatisfiable. A ∧ B et A ∨ B sont satisfiables et invalides.<\/li><li>Une analyse sémantique examine les valeurs finales : toutes V → valide ; au moins une F → invalide.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"models\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Voir les modèles et les interprétations fausses<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Parcourir les interprétations, observer les lignes vertes et roses, et voir comment les résultats déterminent le statut de la formule. Les 13 exemples de validité du cours sont inclus.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article>"}, {"title": "Substitution", "sourceSlides": [10, 11, 12], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une substitution uniforme associe une formule A à une variable propositionnelle p. On peut la noter [p\\A].<\/li><li>B[p\\A] remplace simultanément toutes les occurrences de p dans B par A. Le résultat est une instance de B.<\/li><li>Un schéma représente les formules obtenues par substitution uniforme à partir d’une même formule.<\/li><li>À partir du schéma ¬(A ∧ ¬A), on obtient notamment ¬(b ∧ ¬b) et ¬((a ∨ b) ∧ ¬(a ∨ b)).<\/li><li>Toute substitution uniforme d’une formule valide produit une formule valide.<\/li><li>Lorsqu’on remplace plusieurs variables, leurs remplacements sont simultanés : on ne substitue pas de nouveau à l’intérieur des formules introduites.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"substitute\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Remplacer toutes les occurrences, simultanément<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Choisir l’exemple a → (b → ¬a), ou le schéma d’équivalence, et observer les occurrences remplacées. Les parenthèses protègent la structure des formules.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Tautologie&quot;, &quot;Vraie dans toutes les interprétations.&quot;], [&quot;Inconsistance&quot;, &quot;Fausse dans toutes les interprétations.&quot;], [&quot;Modèle&quot;, &quot;Interprétation qui rend la formule vraie.&quot;], [&quot;Substitution&quot;, &quot;Remplacement uniforme des occurrences d’une variable.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Formes normales", "slides": [{"title": "Logique Formelle", "blocks": ["Chapitre 5 : Formes normales\n"]}, {"title": "Formes normales", "blocks": ["\nPour toute formule il y a une infinité d'autres formules équivalentes \n\nEst-ce qu'on peut définir une forme standardisée des formules ? \n\nForme normale : spécifiée par des restrictions de la syntaxe. \n\nToute formule doit pouvoir être transformée en une formule en \n     forme normale, et qui lui est équivalente, alors appelée sa forme      \n      normale. \n\nFormule en forme normale = seulement ∧,∨ et des négations sur les ´ variables.\n\nToute formule admet une forme normale équivalente\n\nLa formule ¬a∨b est en forme normale. a  b est équivalente \n      mais n’est pas en forme normale. ´"]}, {"title": "Formes normales", "blocks": [" Un littéral ´ est une variable ou la négation d’une variable.\n \nUn monôme est une conjonction de littéraux. \n\n Une clause est une disjonction de littéraux.\n", "Exemple \nx, y, ¬z sont des littéraux. \n x ∧ ¬y ∧ z est un monôme \n Le monôme  x ∧ ¬y ∧ z ∧ ¬x comporte x et ¬x : il vaut 0.\n x ∨ ¬y ∨z est une clause\nLa clause x ∨ ¬y ∨z ∨ ¬x comporte x et ¬x : elle vaut 1.\n", "Toute formule est équivalente à une disjonction de conjonctions de littéraux, et à une conjonction de disjonctions de littéraux. "]}, {"title": "Formes normales de négation", "blocks": ["Une formule est en forme normale de négation si elle ne contient pas d'applications de l'opérateur ¬ sauf des applications à des variables propositionnelles.\n\nExemples : ¬x ∧ ¬y ∧ z \n                        (¬x ∨ y) ∧ (¬z ∨ x) \nContre-exemples : ¬(x ∧ y) \n                                 : ¬¬y\n\nRègles de réécriture : \n¬¬X  X                        (1) \n¬(X ∧ Y )   (¬X ∨ ¬Y ) (2) \n¬(X ∨ Y )   (¬X ∧ ¬Y ) (3) \nOn peut appliquer une règle de transformation à n'importe quel endroit de la formule à transformer : soit à la formule entière, soit à l'intérieur de la formule."]}, {"title": "Formes normales de négation", "blocks": ["La première règle permet les transformations suivantes : \n   Transformer la formule ¬¬(x1 ∧ x2) en x1 ∧ x2, en appliquant la règle à la formule entière ; \n Transformer la formule (x1 ∨ ¬¬x2) en (x1 ∨ x2), en appliquant la règle de transformation seulement à la sous-formule rouge.\n\nLes règles de transformation sont écrites avec des variables en majuscules X, Y et pas avec des variables en minuscules x, y comme les variables propositionnelles. \n\nLes variables propositionnelles dénotent des valeurs de vérité, tandis que les variables utilisées dans les règles de transformation dénotent des formules propositionnelles"]}, {"title": "Formes normales de négation", "blocks": ["Exemple:\n\nAppliquer les règles tant que possible : \n¬(x ∧ (y ∨ ¬z)) \nse transforme en ¬x ∨ ¬(y ∨ ¬z) par règle (2)\n \nse transforme en ¬x ∨ (¬y ∧ ¬¬z) par règle (3) \n\nse transforme en ¬x ∨ (¬y ∧ z) par règle (1)"]}, {"title": "Formes normales conjonctive", "blocks": ["Les formes normales conjonctives et disjonctives sont des normalisations d'expressions logiques à laquelle on peut réduire toute proposition\n\nOn peut toujours écrire une proposition sous forme normale disjonctive et sous forme normale conjonctive. Il suffit pour cela de:\n remplacer les symboles   et ↔ par leur équivalent avec les symboles ∨,∧,¬\n                     (a → b) ≡ (¬a∨b)\n                     (a ↔ b) ≡  ((a → b)∧(b → a))\n\n\nd'utiliser les lois de Morgan ¬(A∨B)=¬A∧¬B et ¬(A∧B)=¬A∨¬B \n\net d'utiliser la distributivité de ∧ par rapport à ∨ ou inversement.\n\n"]}, {"title": "Formes normales conjonctive", "blocks": ["une forme normale conjonctive est l'écriture d'une proposition comme conjonction de disjonctions de littéraux, c'est-à-dire que la proposition est écrite comme la conjonction (avec le symbole ET ∧) d'une disjonction (avec le symbole OU ∨) de littéraux (c'est-à-dire des variables ou la négation ¬ de ces variables); par exemple, voici une formule sous forme conjonctive :(A∨¬B∨C)∧(¬A∨D)∧E.\n\nUne forme normale conjonctive (FNC, ou CNF pour Conjunctive Normal Form) est une conjonction de clauses, c’est-`a-dire une conjonction de disjonctions de littéraux. Voici un exemple et un contre-exemple :\n\n (¬ p ∨ q ∨ r) ∧ (¬q ∨ r) ∧ (¬r)        – CNF \n (¬ p ∨ q ∨ r) ∧ ¬(¬q ∨ r) ∧ (¬r)     – non CNF\n\nUne forme normale conjonctive est valide si et seulement toutes ses clauses sont valides"]}, {"title": "Formes normales conjonctive", "blocks": ["Exemple1:\nDonner la FNC (forme normale conjonctive) de:\n (P ∧ (Q  R)  S)  "]}, {"title": "Formes normales conjonctive", "blocks": ["Exemple2:\nRéécrit la formule (¬p  ¬q)  (p  q) en forme conjonctive normale."]}, {"title": "Formes normales disjonctive", "blocks": ["Une forme normale disjonctive est l'écriture d'une proposition comme disjonction de conjonctions de littéraux, c'est-à-dire que la proposition est écrite comme la disjonction (avec le symbole OU ∨∨) d'une conjonction (avec le symbole ET ∧∧) de littéraux (c'est-à-dire des variables ou la négation ¬¬ de ces variables); par exemple, voici des propositions sous forme disjonctive :(¬A∧¬B)∨(¬C∧D)∨E.\n\nDonner la FND (forme normale disjonctive) de (P ∨ ¬Q)  R"]}], "topics": [{"title": "Formes normales", "sourceSlides": [2, 3], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une même formule admet une infinité de formules équivalentes. Une forme normale impose des restrictions de syntaxe pour standardiser son écriture.<\/li><li>Les formes étudiées utilisent ∧, ∨ et des négations directement appliquées aux variables.<\/li><li>Toute formule propositionnelle admet des formes normales équivalentes. ¬a ∨ b est déjà sous cette forme ; a → b doit être réécrite.<\/li><li>Un littéral est une variable ou sa négation : x, y et ¬z sont des littéraux.<\/li><li>Un monôme est une conjonction de littéraux, par exemple x ∧ ¬y ∧ z. Un monôme contenant x et ¬x est faux.<\/li><li>Une clause est une disjonction de littéraux, par exemple x ∨ ¬y ∨ z. Une clause contenant x et ¬x est vraie.<\/li><li>Toute formule est équivalente à une disjonction de conjonctions de littéraux et à une conjonction de disjonctions de littéraux.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"anatomy\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Reconnaître la structure en manipulant les groupes<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Sélectionner une expression pour voir ses littéraux, ses clauses ou ses monômes. Les regroupements colorés rendent visibles le ET principal ou le OU principal.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article>"}, {"title": "Formes normales de négation", "sourceSlides": [4, 5, 6], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une FNN utilise ∧ et ∨ ; la négation ne porte que sur des variables propositionnelles. Les implications et les équivalences sont éliminées au préalable.<\/li><li>Exemples : ¬x ∧ ¬y ∧ z ; (¬x ∨ y) ∧ (¬z ∨ x).<\/li><li>¬(x ∧ y) et ¬¬y ne sont pas en FNN.<\/li><li>Réécritures : ¬¬X ≡ X ; ¬(X ∧ Y) ≡ ¬X ∨ ¬Y ; ¬(X ∨ Y) ≡ ¬X ∧ ¬Y.<\/li><li>Une règle peut être appliquée à la formule entière ou à une sous-formule.<\/li><li>¬¬(x1 ∧ x2) devient x1 ∧ x2 ; x1 ∨ ¬¬x2 devient x1 ∨ x2.<\/li><li>Dans les règles, X et Y désignent des formules ; x, y et z désignent des variables propositionnelles.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"nnf\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Pousser les négations jusqu’aux variables<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Transformer ¬(x ∧ (y ∨ ¬z)) en ¬x ∨ (¬y ∧ z), en suivant chaque application de De Morgan et de la double négation.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article>"}, {"title": "Formes normales conjonctive", "sourceSlides": [7, 8, 9, 10], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une FNC, ou CNF, est une conjonction de clauses : un ET de groupes reliés par OU. Un littéral seul est aussi une clause.<\/li><li>Exemples : (A ∨ ¬B ∨ C) ∧ (¬A ∨ D) ∧ E ; (¬p ∨ q ∨ r) ∧ (¬q ∨ r) ∧ ¬r.<\/li><li>(¬p ∨ q ∨ r) ∧ ¬(¬q ∨ r) ∧ ¬r n’est pas une FNC, car une négation porte sur un groupe.<\/li><li>Méthode : éliminer → et ↔, appliquer De Morgan et la double négation, puis distribuer ∨ sur ∧.<\/li><li>a → b ≡ ¬a ∨ b ; a ↔ b ≡ (a → b) ∧ (b → a).<\/li><li>Distribution : p ∨ (q ∧ r) ≡ (p ∨ q) ∧ (p ∨ r).<\/li><li>Une FNC est valide si et seulement si chacune de ses clauses est valide.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"cnf\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Construire la FNC, une réécriture à la fois<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Explorer les deux exemples du cours : (P ∧ (Q → R)) → S et (¬p → ¬q) → (p → q). Chaque étape conserve l’équivalence.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article>"}, {"title": "Formes normales disjonctive", "sourceSlides": [11], "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une FND, ou DNF, est une disjonction de monômes : un OU de groupes reliés par ET. Un littéral seul est aussi un monôme.<\/li><li>Exemple : (¬A ∧ ¬B) ∨ (¬C ∧ D) ∨ E.<\/li><li>Après élimination des implications et normalisation des négations, distribuer ∧ sur ∨.<\/li><li>Distribution : p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r).<\/li><li>FNC et FND sont des écritures différentes qui conservent le sens de la formule initiale.<\/li><\/ul><section class=\"logicstudio studio45\" data-explore=\"dnf\"><div class=\"logicstudiohead\"><span>COMPRENDRE PAR LA MANIPULATION<\/span><h3>Construire la FND et comparer avec la FNC<\/h3><div class=\"logicgoal\"><b>À explorer<\/b><p>Transformer (P ∨ ¬Q) → R, visualiser ses monômes, puis vérifier que les colonnes de vérité restent identiques.<\/p><\/div><\/div><div class=\"exploremount\"><\/div><\/section><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Littéral&quot;, &quot;Variable propositionnelle ou sa négation.&quot;], [&quot;FNN&quot;, &quot;Négations appliquées aux variables, avec ∧ et ∨.&quot;], [&quot;FNC&quot;, &quot;Conjonction de clauses.&quot;], [&quot;FND&quot;, &quot;Disjonction de monômes.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Logique des prédicats d’ordre 1", "topics": [{"title": "Introduction", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La logique des prédicats du premier ordre (ou simplement logique du premier ordre) est une extension de la logique propositionnelle qui permet de formaliser des énoncés plus complexes et de raisonner sur des objets et leurs relations. Contrairement à la logique propositionnelle, qui traite uniquement de propositions ou de déclarations qui sont soit vraies, soit fausses, la logique des prédicats introduit des éléments supplémentaires tels que des individus, des prédicats, et des quantificateurs.<\/li><li>Considérons l’exemple de raisonnement qui suit :<\/li><li>TOUT être humain est mortel. \tOR Socrate est un être humain. \tDONC Socrate est mortel.<\/li><li>La logique des propositions ne permet pas de ‘formuler’ des raisonnements comme celui-ci, vu qu’il n’existe pas de notion d’énoncé singulier (exp. Socrate est mortel) et d’énoncé générique (Tout être humain est mortel).<\/li><li>En logique de prédicats, nous avons cette notion d’énoncé singulier et d’énoncé générique qui se base sur d’autres notions, à savoir, les objets ou les individus et leurs désignateurs : les constantes et les variables (cf. Lois de la pensée) , les propriétés d’objets (exp. Mortalité) et les relations entre les objets (exp. Ahmed est le père d’Ali) appelées prédicats.<\/li><li>En logique de prédicats, nous pouvons écrire (ou formuler) ‘Socrate est un être humain’ sous la forme : être-humain(Socrate) où ‘Socrate’ est l‘individu ou l’objet, et ‘être-humain’ est la propriété.<\/li><li>Pour formuler un énoncé générique comme ‘TOUT être humain est mortel’, la logique des prédicats emploie le quantificateur universel ∀ .<\/li><li>Le raisonnement précédent peut être formulé comme suit :<\/li><li>∀x   être-humain(x) → mortel(x) \têtre-humain(Socrate) \tDONC mortel(Socrate)<\/li><li>La logique de prédicats a pour but de généraliser la logique propositionnelle en introduisant les variables (exp. x), les quantificateurs (exp. . ∀ et les prédicats (exp. mortel), c’est pour cela qu’on la nomme aussi logique de 1er ordre.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Règle générale&quot;, &quot;∀x (Humain(x) → Mortel(x))&quot;], [&quot;Instantiation&quot;, &quot;Humain(Socrate) → Mortel(Socrate)&quot;], [&quot;Fait&quot;, &quot;Humain(Socrate)&quot;], [&quot;Modus ponens&quot;, &quot;Mortel(Socrate)&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Du fait à la conclusion<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Syntaxe de la logique des prédicats du premier ordre", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Alphabet de base<\/li><li>L&#x27;alphabet de la logique des prédicats du premier ordre est composé des éléments suivants :<\/li><li>un ensemble dénombrable R de symboles de prédicats à n arguments (0 ≤n), par exemple, P, Q,R. …<\/li><li>un ensemble dénombrable VAR de variables d&#x27;objets ou d&#x27;individus, par exemple, x,y,z,...<\/li><li>un ensemble dénombrable F de symboles de fonctions à n arguments (0 ≤n), par exemple, f, g, ... , âge-de, ...<\/li><li>les quantificateurs ∀, ∃<\/li><li>les connecteurs : ¬ ,  ∨ ,  ∧ , → et <\/li><li>les séparateurs ‘(‘ et  ‘)‘.<\/li><li>Rq: les constantes : F (faux,) et V (vrai) sont généralement non considérées.<\/li><\/ul><\/article>"}, {"title": "Fonctions de la logique des prédicats du premier ordre", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>En logique du premier ordre, une fonction est un symbole qui associe à chaque ensemble d&#x27;éléments du domaine d&#x27;interprétation un autre élément du domaine. Les fonctions sont des objets fondamentaux dans le langage de premier ordre, car elles permettent de modéliser des relations structurelles complexes entre les objets.<\/li><li>exemples concrets de fonctions dans des contextes variés :<\/li><li>Les fonctions peuvent être utilisées pour modéliser des opérations arithmétiques. Par exemple, supposons un domaine d&#x27;interprétation où les éléments sont des nombres entiers.<\/li><li>Addition : + est une fonction binaire qui prend deux entiers et renvoie leur somme.<\/li><li>Exemple : +(3,5) donne 8.<\/li><li>Multiplication : × est une fonction binaire qui prend deux entiers et renvoie leur produit.<\/li><li>Exemple : ×(4,2) donne 8.<\/li><li>Carré : f(x)=x2 est une fonction unaire qui prend un entier et renvoie son carré.<\/li><li>Exemple : f(4)=16.<\/li><li>Considérons un domaine d&#x27;interprétation où les objets sont des personnes.<\/li><li>Âge : Soit Age(x) une fonction qui renvoie l&#x27;âge de la personne x.<\/li><li>Exemple : Age(Alice)=30, ce qui signifie qu&#x27;Alice a 30 ans.<\/li><li>Mère de : Soit Mère(x) une fonction unaire qui renvoie la mère de la personne x.<\/li><li>Exemple : Mère(Alice)=Marie, ce qui signifie que Marie est la mère d&#x27;Alice.<\/li><li>Lieu de naissance : Naissance(x) une fonction qui associe à chaque personne x le lieu de naissance de x.<\/li><li>Exemple : Naissance(Alice)=Paris.<\/li><li>Supposons que nous avons un domaine d&#x27;interprétation qui inclut des objets géométriques, tels que des points dans un plan.<\/li><li>Coordonnée x d&#x27;un point : Soit X(P) une fonction qui renvoie la coordonnée x du point P.<\/li><li>Exemple : Si P=(3,4), alors X(P)=3.<\/li><li>Coordonnée y d&#x27;un point : Soit Y(P) une fonction qui renvoie la coordonnée y du point P.<\/li><li>Exemple : Si P=(3,4), alors Y(P)=4.<\/li><li>Distance entre deux points : Soit d(P,Q) une fonction binaire qui renvoie la distance entre les points P et Q.<\/li><li>Exemple : Si P=(1,2) et Q=(4,6), alors d(P,Q)=sqrt{(4 - 1)^2 + (6 - 2)^2} = 5.<\/li><\/ul><\/article><section class=\"study\" data-study=\"domain\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Objets, fonctions et prédicats<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Prédicats", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Les prédicats en logique du premier ordre sont des symboles qui expriment des relations ou des propriétés concernant des objets dans un domaine d&#x27;interprétation. Un prédicat peut être unitaire (prenant un seul argument), binaire (prenant deux arguments), ou plus généralement n-aire (prenant nnn arguments).<\/li><li>exemples concrets de prédicats dans divers contextes :<\/li><li>Prédicats arithmétiques<\/li><li>Les prédicats peuvent être utilisés pour exprimer des relations arithmétiques entre des nombres.<\/li><li>Égalité : = est un prédicat binaire qui vérifie si deux nombres sont égaux.  Exemple : 3=5 est faux, mais 3=3 est vrai.<\/li><li>Inférieur à : &lt; est un prédicat binaire qui exprime la relation &quot;inférieur à&quot;.     Exemple : 4&lt;5 est vrai, mais 5&lt;4 est faux.<\/li><li>Divisibilité : Div(x,y) est un prédicat binaire qui est vrai si x est divisible par y.<\/li><li>Exemple : Div(6,3) est vrai (car 6÷3=2).<\/li><li>Les prédicats peuvent être utilisés pour exprimer des propriétés ou des relations sociales entre des individus.<\/li><li>Est une personne : Personne(x) est un prédicat unaire qui est vrai si x est une personne.<\/li><li>Exemple : Personne(Alice) est vrai, mais Personne(Mars) est faux (si Mars est une planète).<\/li><li>Est ami de : Ami(x,y) est un prédicat binaire qui est vrai si x et y sont amis.<\/li><li>Exemple : Ami(Alice,Bob) est vrai si Alice et Bob sont amis,<\/li><li>Est père de : Pere(x,y) est un prédicat binaire qui est vrai si x est le père de y.<\/li><li>Exemple : Pere(Jean,Pierre) est vrai si Jean est le père de Pierre.<\/li><\/ul><\/article><section class=\"study\" data-study=\"domain\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Objets, fonctions et prédicats<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Termes", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Un terme est une expression qui représente un objet ou un individu dans le domaine d&#x27;interprétation. Un terme peut être :<\/li><li>Une constante (par exemple, a, b).<\/li><li>Une variable (par exemple, x, y).<\/li><li>Une fonction appliquée à des termes. Par exemple, si f est une fonction et xun terme, f(x) est aussi un terme.<\/li><li>Exemples de termes avec des fonctions :<\/li><li>Fonction unaire :<\/li><li>Soit f une fonction qui prend un seul argument. Un terme comme f(x) désigne l&#x27;objet que la fonction f associe à x.<\/li><li>Exemple : Si f est une fonction qui associe à chaque nombre x son carré (donc f(x) = x^2), alors f(3) désigne 9, c&#x27;est-à-dire le carré de 3.<\/li><li>Fonction binaire :<\/li><li>Si g(x,y)  est une fonction qui donne la somme de x et y (donc g(x,y)=x+y, alors g(3,5) désigne 8, c&#x27;est-à-dire la somme de 3 et 5.<\/li><\/ul><\/article><section class=\"study\" data-study=\"domain\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Objets, fonctions et prédicats<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Atomes", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>En logique du premier ordre, un atome est une expression logique élémentaire qui ne peut pas être décomposée davantage. Un atome est généralement une relation (prédicat) appliquée à un ou plusieurs termes. Il peut exprimer des faits simples sur les objets du domaine d&#x27;interprétation.<\/li><li>Les atomes sont donc les constructions de base qui forment des propositions dans un langage de logique du premier ordre. Un atome a la forme :<\/li><li>P(t1,t2,…,tn) où :<\/li><li>P est un prédicat de n arguments (unitaire, binaire, ternaire, etc.),<\/li><li>t1,t2,…,tn sont des termes (variables, constantes, ou applications de fonctions).<\/li><li>Voici des exemples concrets d&#x27;atomes dans différents contextes :<\/li><li>Dans un domaine où les objets sont des nombres entiers, un atome peut être une relation arithmétique entre ces nombres.<\/li><li>Égalité :  3=5 Cet atome exprime que 3 est égal à 5. Cet atome est faux.<\/li><li>Inférieur à :<\/li><li>4&lt;5 Cet atome exprime que 4 est inférieur à 5. Cet atome est vrai.<\/li><li>Divisibilité :<\/li><li>Div(6,3) Cet atome exprime que 6 est divisible par 3. Cet atome est vrai.<\/li><li>Dans un domaine où les objets sont des personnes, un atome peut exprimer des faits sur les relations entre ces personnes.<\/li><li>Ami de :<\/li><li>Ami(Alice,Bob) Cet atome exprime que Alice est amie de Bob.<\/li><li>Si  Alice et Bob sont effectivement amis, cet atome est vrai,<\/li><li>sinon il est faux.<\/li><li>Est père de :<\/li><li>Pere(Jean,Pierre) Cet atome exprime que Jean est le père de Pierre. Si Jean est effectivement le père de Pierre, cet atome est vrai, sinon il est faux.<\/li><\/ul><\/article><section class=\"study\" data-study=\"domain\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Objets, fonctions et prédicats<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Formules bien formées", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>En logique du premier ordre (LFO), une formule bien formée (ou formule logique) est une expression qui est correctement construite à partir de termes, de prédicats, de connecteurs logiques et de quantificateurs selon des règles de syntaxe précises. Une formule bien formée peut exprimer des propositions ou des relations sur des objets dans un domaine d&#x27;interprétation.<\/li><li>Règles pour qu&#x27;une formule soit bien formée :<\/li><li>Atomes : Un atome est une expression de la forme P(t1,t2,…,tn) , où P est un prédicat et t1,t2,…,tn sont des termes. Par exemple :<\/li><li>P(x)<\/li><li>R(a,b)<\/li><li>Div(6,3)<\/li><li>Formules simples : Une formule est soit un atome, soit une négation (¬) d&#x27;une formule, soit une conjonction (∧) ou une disjonction (∨) de formules, soit une implication (→) ou une équivalence (↔) de formules.<\/li><li>Formules avec quantificateurs : Une formule peut aussi contenir des quantificateurs. Les quantificateurs sont appliqués à des variables et affectent toute une sous-formule.<\/li><li>∀x P(x) : &quot;Pour tout x, P(x) est vrai.&quot;<\/li><li>∃x Q(x) : &quot;Il existe un x tel que Q(x) est vrai.«<\/li><li>Exemples de formules bien formées<\/li><li>Atomes : P(x) : Un atome où P est un prédicat unaire et x est un terme (variable).<\/li><li>Div(x,3) : Un atome exprimant que x est divisible par 3.<\/li><li>Formules avec négation :<\/li><li>¬P(x) : La négation de l&#x27;atome P(x).<\/li><li>¬(P(x)∧Q(y)) : La négation de la conjonction entre P(x) et Q(y).<\/li><li>Formules avec connecteurs logiques :<\/li><li>P(x)∧Q(x) : La conjonction de P(x) et Q(x).<\/li><li>P(x)∨Q(x) : La disjonction de P(x) et Q(x).<\/li><\/ul><\/article><section class=\"study\" data-study=\"domain\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Objets, fonctions et prédicats<\/h3><\/div><div class=\"studymount\"><\/div><\/section><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Terme&quot;, &quot;Désigne un objet du domaine.&quot;], [&quot;Fonction&quot;, &quot;Associe des objets à un objet.&quot;], [&quot;Prédicat&quot;, &quot;Exprime une propriété ou une relation.&quot;], [&quot;Atome&quot;, &quot;Prédicat appliqué à des termes, sans connecteur ni quantificateur.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Logique des prédicats d’ordre 1 Interprétation de formules", "topics": [{"title": "Prédicats de premier ordre", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Les prédicats de premier ordre sont des expressions qui prennent un ou plusieurs arguments et qui renvoient une valeur de vérité (vrai ou faux). En logique du premier ordre, ces prédicats sont utilisés pour décrire des propriétés des objets ou des relations entre plusieurs objets.<\/li><li>Voici quelques exemples de prédicats de premier ordre :<\/li><li>1. Prédicats unaires (à un seul argument) :<\/li><li>P(x) : &quot;x est un nombre premier&quot;.<\/li><li>Exemple : P(7) est vrai, P(4) est faux.<\/li><li>A(x) : &quot;x est un auteur&quot;.<\/li><li>Exemple : A(&quot;Victor Hugo&quot;) est vrai, A(&quot;Napoléon&quot;) est faux.<\/li><li>B(x) : &quot;x est beau&quot;.<\/li><li>2. Prédicats binaires (à deux arguments) :<\/li><li>R(x, y) : &quot;x aime y&quot;.<\/li><li>Exemple : R(&quot;Pierre&quot;, &quot;Marie&quot;) est vrai si Pierre aime Marie.<\/li><li>M(x, y) : &quot;x est plus grand que y&quot;.<\/li><li>Exemple : M(5, 3) est vrai, M(2, 8) est faux.<\/li><li>L(x, y) : &quot;x est un parent de y&quot;.<\/li><li>Exemple : L(&quot;Marie&quot;, &quot;Paul&quot;) est vrai si Marie est la mère (ou le père) de Paul.<\/li><li>3. Prédicats ternaires (à trois arguments) :<\/li><li>S(x, y, z) : &quot;x donne y à z&quot;.<\/li><li>Exemple : S(&quot;Pierre&quot;, &quot;un cadeau&quot;, &quot;Marie&quot;) est vrai si Pierre donne un cadeau à Marie.<\/li><li>D(x, y, z) : &quot;x entre dans y après z&quot;.<\/li><li>Exemple : D(&quot;Paul&quot;, &quot;la maison&quot;, &quot;le jardin&quot;) est vrai si Paul entre dans la maison après être passé par le jardin.<\/li><\/ul><\/article>"}, {"title": "Prédicats avec quantificateurs", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Les quantificateurs sont des symboles utilisés en logique du premier ordre pour indiquer l&#x27;étendue d&#x27;une affirmation concernant les objets d&#x27;un domaine donné. Ils permettent de généraliser ou d&#x27;exister des propriétés ou des relations. Il existe deux principaux types de quantificateurs : le quantificateur universel et le quantificateur existentiel.<\/li><li>1. Quantificateur Universel (∀)<\/li><li>Le quantificateur universel ∀ (ou &quot;pour tout&quot;) exprime qu&#x27;une propriété ou une relation est vraie pour tous les éléments d&#x27;un domaine.<\/li><li>Notation : ∀xP(x)<\/li><li>Signification : &quot;Pour tout x, P(x) est vrai.&quot; Cela signifie que, peu importe quel élément x on prend dans le domaine, l&#x27;énoncé P(x) sera toujours vrai.<\/li><li>Exemple :<\/li><li>∀x(x&gt;0) signifie &quot;tout x est plus grand que 0&quot;, ce qui est vrai si on parle de l&#x27;ensemble des nombres réels positifs.<\/li><li>∀x(A(x)→B(x)) signifie par exemple  &quot;pour tout x, si x est un auteur, alors x est un être humain&quot;.<\/li><li>∀x P(x) : &quot;Tous les x sont premiers&quot;.<\/li><li>∀x(x∈N→x+0=x)Signification : &quot;Pour tout x appartenant à l&#x27;ensemble des entiers naturels (N), on a x+0=x.&quot;Cette proposition est vraie, car l&#x27;addition de zéro à n&#x27;importe quel nombre naturel laisse ce nombre inchangé.<\/li><li>∀x∈Z,(est_pair(x)→ est_divisible_par_2(x))Signification : &quot;Pour tout x dans l&#x27;ensemble des entiers (Z), si x est pair, alors x est divisible par 2.«<\/li><li>∀x(P(x)→Q(x))Signification : &quot;Pour tout x, si P(x) est vrai, alors Q(x) est également vrai.&quot;Cette forme générale est utilisée pour exprimer des relations de type conditionnel entre deux propositions.<\/li><li>Predicats avec quantificateurs multiples) :<\/li><li>Les prédicats avec quantificateurs universels multiples sont utilisés pour exprimer des relations qui s&#x27;étendent sur plusieurs variables, souvent dans un contexte où les propriétés ou relations dépendent de plusieurs objets. Ces prédicats permettent de formaliser des énoncés complexes en logique du premier ordre.<\/li><li>∀x∀y(R(x,y)→S(x,y))Signification : &quot;Pour tous x et y, si x est lié à y par la relation R, alors x et y satisfont la relation S.&quot;C&#x27;est une expression plus générale où on considère deux variables et une relation entre elles.<\/li><li>∀x∀y(P(x)∧P(y)→D(x,y)≥0)Signification : &quot;Pour tous x et y, si x et y sont des points dans le plan, alors la distance entre x et y est positive ou nulle.&quot;Ici, P(x) et désignent le fait que x et y sont des points dans le plan, et D(x,y)  est la fonction qui calcule la distance entre ces deux points.<\/li><li>∀x∀y(divise(x, y)→divise(x, x×y))Signification : &quot;Pour tous x et y, si x divise y, alors x divise également x×y.&quot;∀x∀y∀z(R(x,y)∧R(y,z)→R(x,z))  (Transitivité)Signification : &quot;Pour tous x, y, et z, si x est en relation avec y et y est en relation avec z, alors x est en relation avec z.&quot;Ce prédicat modélise une relation transitive, où R(x,y) est une relation entre x et y. Par exemple, si R(x,y) représente &quot;être plus âgé que&quot;, alors la relation devient transitive : &quot;Si x est plus âgé que y et y est plus âgé que z, alors x est plus âgé que z.«<\/li><li>∀x∀y(M(x,y)→M(y,x)) (Symetrie)Signification : &quot;Pour tous x et y, si M(x,y) est vrai, alors M(y,x) est également vrai.&quot;Cela exprime que la relation M(x,y) est symétrique, comme dans le cas de la matrice symétrique en algèbre linéaire, où M(x,y) signifie que l&#x27;élément à la position (x,y) est égal à l&#x27;élément à la position (y,x).<\/li><li>∀x(R(x,x)) (Réflexivité)Signification : &quot;Pour tout x, x est en relation avec lui-même.&quot;Cet énoncé formalise la réflexivité d&#x27;une relation R. Par exemple, &quot;être égal à&quot; est une relation réflexive, car chaque élément est égal à lui-même.<\/li><li>∀x∀y(x⊆y→card(x)≤card(y)) (Inclusion)Signification : &quot;Pour tous x et y, si x est un sous-ensemble de y, alors la cardinalité de x est inférieure ou égale à la cardinalité de y.&quot;Cela formalise la propriété selon laquelle si un ensemble est inclus dans un autre, son cardinal (le nombre d&#x27;éléments) est inférieur ou égal à celui de l&#x27;autre ensemble.<\/li><li>Les prédicats avec quantificateurs universels multiples permettent d&#x27;exprimer des énoncés plus complexes impliquant plusieurs objets ou variables. En utilisant des quantificateurs universels ( ∀) pour plusieurs variables, on peut formaliser des relations, des propriétés de structures mathématiques, ou des règles logiques qui s&#x27;appliquent à des ensembles d&#x27;éléments. Ces énoncés sont fondamentaux pour travailler dans des systèmes formels comme les mathématiques, l&#x27;informatique, et la logique.<\/li><li>2. Quantificateur Existential (∃)<\/li><li>Le quantificateur existentiel ∃ (ou &quot;il existe&quot;) affirme qu&#x27;il y a au moins un élément dans le domaine pour lequel une propriété ou une relation est vraie.<\/li><li>Notation : ∃xP(x)<\/li><li>Signification : &quot;Il existe un x tel que P(x) est vrai.&quot; Cela signifie qu&#x27;il existe au moins un élément dans le domaine pour lequel l&#x27;énoncé P(x) est vrai.<\/li><li>Le quantificateur existentiel ∃ est utilisé pour affirmer qu&#x27;il existe au moins un élément dans un domaine qui satisfait une propriété donnée. Il est couramment utilisé pour formaliser des énoncés logiques dans les mathématiques, la biologie, les sciences sociales et la géométrie, ainsi que dans d&#x27;autres domaines où il est important d&#x27;exprimer l&#x27;existence d&#x27;objets ou d&#x27;entités.<\/li><li>∃x(x&gt;0)   signifie &quot;il existe un x qui est plus grand que 0&quot;, ce qui est vrai dans l&#x27;ensemble des nombres réels.<\/li><li>∃x(A(x)∧B(x)) signifie par exemple &quot;il existe un x qui est à la fois un auteur et un être humain&quot;.<\/li><li>∃x∈R(x^2=4) signifie : &quot;Il existe un réel x tel que x^2 = 4.&quot;Cette proposition est vraie, car il existe des réels qui satisfont cette équation (par exemple x=2 et x=−2).<\/li><li>∃x(aime(x,y))Signification : &quot;Il existe une personne x qui aime la personne y.&quot;Cette phrase est vraie si, dans le domaine des personnes, il existe quelqu&#x27;un qui aime y.<\/li><li>∃x∃y(R(x,y))Signification : &quot;Il existe un x et un y tels que R(x,y) est vrai.&quot;Par exemple, R(x,y) pourrait signifier &quot;x est l&#x27;ami de y&quot;, donc cette proposition signifie qu&#x27;il existe au moins une paire de personnes qui sont amies.<\/li><li>∃x∃y∈Z(x+y=10)Signification : &quot;Il existe deux entiers x et y tels que leur somme est égale à 10.&quot;Cette proposition est vraie, car il existe des paires d&#x27;entiers qui satisfont cette équation, par exemple x=3 et y=7<\/li><li>∃x∃y(R(x,y)∧R(y,x))Signification : &quot;Il existe deux éléments x et y tels que x est en relation avec y et y est en relation avec x.&quot;Cela exprime l&#x27;existence d&#x27;une relation symétrique entre x et y, par exemple dans un contexte où R(x,y) signifie &quot;est ami de&quot;.<\/li><li>∃x∃y(Professeur(x)∧ etudiant(y)∧ enseigne(x, y))Signification : &quot;Il existe un professeur x et un étudiant y tels que x enseigne à y.&quot;Cette phrase est vraie si, dans une institution donnée, il existe au moins une relation de ce type entre un professeur et un étudiant.<\/li><\/ul><\/article><section class=\"study\" data-study=\"quant\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Explorer les quantificateurs sur un domaine fini<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Combinaison de Quantificateurs", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Combiner les quantificateurs universels ( ∀ ) et existentiels ( ∃ ) permet de formaliser des énoncés complexes où certaines propriétés doivent être valables pour tous les éléments d&#x27;un ensemble, tout en exigeant l&#x27;existence d&#x27;autres éléments qui satisfont à des conditions spécifiques. Ces combinaisons sont couramment utilisées dans des théories mathématiques, des logiques formelles, et d&#x27;autres domaines scientifiques.<\/li><li>Exemples :<\/li><li>∀x∃yR(x,y) : &quot;Pour chaque x, il existe un y tel que la relation R(x,y)  est vraie.&quot; Cela pourrait par exemple signifier &quot;chaque personne a un ami&quot; si R(x,y) représente la relation &quot;est ami avec&quot;.<\/li><li>∃x∀yP(x,y) : &quot;Il existe un x tel que pour tous les y, P(x,y) est vrai.&quot; Par exemple, &quot;Il existe un élève qui comprend tous les sujets.«<\/li><li>∀x∈R(∃y∈R(y^2=x)) : &quot;Pour tout réel x, il existe un réel y tel que<\/li><li>y^2 = x.«  Cette assertion est fausse pour les réels négatifs, mais elle exprime que pour chaque x≥0 il existe un y (la racine carrée de x) qui vérifie y^2 = x.<\/li><\/ul><\/article><section class=\"study\" data-study=\"quant\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Explorer les quantificateurs sur un domaine fini<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Exemples de traduction d'énoncés en formules", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Pour tout entier, il existe un entier plus grand : ∀x ∃y (x &lt; y), sur ℤ.<\/li><li>Il existe un plus grand entier : ∃x ∀y (y ≤ x), sur ℤ. Cette formule est fausse.<\/li><li>Tous les chemins mènent à Rome : ∀x (Chemin(x) → MèneÀRome(x)).<\/li><li>Une porte donnée est ouverte ou fermée : O(p) ∨ F(p). Si les possibilités s’excluent, ajouter ¬(O(p) ∧ F(p)).<\/li><li>Il existe des peines et des plaisirs, sans objet qui soit les deux : (∃x Peine(x)) ∧ (∃y Plaisir(y)) ∧ ∀z ¬(Peine(z) ∧ Plaisir(z)).<\/li><li>Pour formaliser « Tout est relatif », définir d’abord le domaine et le sens du prédicat Relatif.<\/li><\/ul><\/article>"}, {"title": "Priorité des quantificateurs", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Lorsqu&#x27;on combine ces quantificateurs dans une même proposition, l&#x27;ordre dans lequel ils apparaissent joue un rôle crucial dans le sens de l&#x27;énoncé.<\/li><li>Si le quantificateur universel précède le quantificateur existentiel :<\/li><li>Exemple : ∀x∃y P(x,y)<\/li><li>Interprétation : &quot;Pour chaque x, il existe un y tel que P(x,y) est vrai.&quot;<\/li><li>Cela signifie qu&#x27;on peut choisir un y qui dépend de x, mais qui est valable pour chaque x.<\/li><li>Si le quantificateur existentiel précède le quantificateur universel :<\/li><li>Exemple : ∃y∀x P(x,y)<\/li><li>Interprétation : &quot;Il existe un y tel que, pour chaque x, P(x,y) est vrai.&quot;<\/li><li>Cela signifie qu&#x27;il existe un y fixe pour lequel P(x,y) est vrai pour tous les x.<\/li><li>Exemple 1 (quantificateur universel puis existentiel) :<\/li><li>∀x∃y (x+y=0)<\/li><li>Cela signifie : &quot;Pour chaque x, il existe un y tel que x+y=0&quot;<\/li><li>Ce qui est vrai, car pour chaque x, on peut toujours choisir y=−x.<\/li><li>Exemple 2 (quantificateur existentiel puis universel) :<\/li><li>∃y∀x (x+y=0)<\/li><li>Cela signifie : &quot;Il existe un y tel que, pour chaque x, x+y=0&quot;<\/li><li>Ce n&#x27;est pas vrai en général, car il n&#x27;existe pas de y qui satisfait cette équation pour tous les x (le seul y possible serait y=0, mais dans ce cas, l&#x27;énoncé n&#x27;est pas valable pour tous les x).<\/li><\/ul><\/article><section class=\"study\" data-study=\"quant\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Explorer les quantificateurs sur un domaine fini<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Négation des quantificateurs", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La négation des quantificateurs en logique est une opération importante, qui permet de transformer des énoncés impliquant des quantificateurs universels (∀) et existentiels (∃) en des énoncés équivalents mais négatifs.<\/li><li>Négation du quantificateur universel (∀)<\/li><li>La négation d&#x27;un quantificateur universel ∀x P(x) (&quot;Pour tout x, P(x) est vrai&quot;) donne une affirmation existantielle.<\/li><li>Formulation :¬(∀x P(x)) est équivalent à ∃x ¬P(x) Cela signifie : &quot;Il existe un x pour lequel P(x) n&#x27;est pas vrai.&quot;<\/li><li>Si une affirmation &quot;pour tout x, P(x) est vrai&quot; est fausse, cela signifie qu&#x27;il existe au moins un x pour lequel P(x) est faux.<\/li><li>Exemple :<\/li><li>¬(∀x (x&gt;0)) devient ∃x (x≤0).<\/li><li>Cela signifie : &quot;Il existe un x tel que x est inférieur ou égal à 0.&quot;<\/li><li>Négation du quantificateur existentiel (∃)<\/li><li>La négation d&#x27;un quantificateur existentiel ∃x P(x) (&quot;Il existe un x tel que P(x) est vrai&quot;) donne une affirmation universelle.<\/li><li>Formulation :¬(∃x P(x))est équivalent  à ∀x ¬P(x). Cela signifie : &quot;Pour tout x, P(x) est faux.&quot;<\/li><li>Si une affirmation &quot;il existe un x tel que P(x) est vrai&quot; est fausse, cela signifie qu&#x27;il n&#x27;existe aucun xx pour lequel P(x) soit vrai, donc P(x) doit être faux pour tous les x.<\/li><li>¬(∃x (x2  =−1))¬ devient ∀x (x2 ≠−1).<\/li><li>Cela signifie : &quot;Pour tout x,  x2  n&#x27;est jamais égal à -1.&quot;<\/li><li>Résumé des règles de négation des quantificateurs :<\/li><li>La négation d&#x27;un quantificateur universel ∀x devient un quantificateur existentiel ∃x, avec la négation de la proposition à l&#x27;intérieur.<\/li><li>¬(∀x P(x))≡∃x ¬P(x)<\/li><li>La négation d&#x27;un quantificateur existentiel ∃x devient un quantificateur universel ∀x, avec la négation de la proposition à l&#x27;intérieur.<\/li><li>¬(∃x P(x))≡∀x ¬P(x)<\/li><li>Exemple combiné :<\/li><li>Prenons un exemple plus complexe avec les deux quantificateurs :<\/li><li>¬(∀x∃y P(x,y))<\/li><li>On peut appliquer la négation étape par étape :<\/li><li>La négation de ∀x devient ∃x et on applique la négation à ∃y P(x,y).<\/li><li>La négation de ∃y devient ∀y et on applique la négation à P(x,y).<\/li><li>Donc, la négation de ∀x∃y P(x,y) devient : ∃x∀y ¬P(x,y))<\/li><li>Cela signifie : &quot;Il existe un x tel que, pour tous les y, P(x,y) est faux.&quot;<\/li><\/ul><\/article><section class=\"study\" data-study=\"quant\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Explorer les quantificateurs sur un domaine fini<\/h3><\/div><div class=\"studymount\"><\/div><\/section><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;∀x P(x)&quot;, &quot;P est vraie pour tous les objets du domaine.&quot;], [&quot;∃x P(x)&quot;, &quot;P est vraie pour au moins un objet du domaine.&quot;], [&quot;¬∀x P(x)&quot;, &quot;∃x ¬P(x)&quot;], [&quot;¬∃x P(x)&quot;, &quot;∀x ¬P(x)&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Système formel de la logique des prédicats et Preuve (axiomatique)", "topics": [{"title": "Introduction", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Le raisonnement en logique formelle consiste à appliquer des règles rigoureuses et des structures formelles pour tirer des conclusions valides à partir d&#x27;hypothèses ou d&#x27;énoncés donnés. Il s&#x27;agit d&#x27;un processus qui utilise des symboles et des opérations logiques bien définis, comme les connecteurs logiques, les quantificateurs et les règles d&#x27;inférence, pour aboutir à des résultats cohérents. Ce raisonnement est souvent utilisé en mathématiques, en philosophie et en informatique.<\/li><li>Le raisonnement en logique repose sur l&#x27;application de règles formelles pour déduire des conclusions à partir d&#x27;hypothèses ou d&#x27;axiomes.<\/li><li>Les règles d&#x27;inférence permettent de dériver des conclusions à partir de prémisses. Par exemple :<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Règle générale&quot;, &quot;∀x (Humain(x) → Mortel(x))&quot;], [&quot;Instantiation&quot;, &quot;Humain(Socrate) → Mortel(Socrate)&quot;], [&quot;Fait&quot;, &quot;Humain(Socrate)&quot;], [&quot;Modus ponens&quot;, &quot;Mortel(Socrate)&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Règles d'inférence", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Modus ponens : Si P→Q et P sont vrais, alors Q est vrai.<\/li><li>Modus tollens : Si P→Q et ¬Q sont vrais, alors ¬P est vrai.<\/li><li>Silogisme disjonctif : Si P∨Q est vrai et ¬P est vrai, alors Q est vrai.<\/li><li>La &quot;technique de preuve&quot; désigne les méthodes ou procédés utilisés pour établir la vérité d&#x27;une proposition ou d&#x27;une hypothèse. Ces techniques sont essentielles dans les domaines comme les mathématiques, la logique, le droit, et les sciences en général.<\/li><li>Voici un aperçu des principales techniques (de preuve) de raisonnement en logique, utilisées dans des systèmes formels comme la logique des propositions et la logique des prédicats.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Prémisse&quot;, &quot;P → Q&quot;], [&quot;Prémisse&quot;, &quot;P&quot;], [&quot;Modus ponens&quot;, &quot;Q&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Preuve directe", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Consiste à démontrer directement qu&#x27;une proposition est vraie en utilisant des raisonnements logiques et des axiomes ou théorèmes déjà établis.<\/li><li>Pour prouver que  𝑝 → 𝑞    est vraie<\/li><li>On suppose que P est vraie<\/li><li>On prouve que Q est aussi vraie<\/li><li>Alors 𝑝 → 𝑞  est vraie.<\/li><li>Exemple : Pour prouver que la somme de deux nombres pairs a et b est paire. On procède comme suit :<\/li><li>a est un nombre pair alors a=2K<\/li><li>b est un nombre pair alors b=2l<\/li><li>a+b=2k + 2l = 2(k+l), ce qui est un multiple de 2.<\/li><li>Par définition, un multiple de 2 est un nombre pair.<\/li><li>Conclusion: la somme de deux nombres pairs est paire<\/li><li>Démonstration :<\/li><li>Soit a et b deux nombres pairs. Par définition, un nombre pair peut être écrit sous la forme 2k , où k est un entier.<\/li><li>On peut donc écrire :<\/li><li>a=2k​, pour un certain entier k1​<\/li><li>b=2k​, pour un certain entier k2<\/li><li>Calculons la différence a−ba - ba−b :<\/li><li>a−b=(2k1)−(2k2) =2(k1−k2)<\/li><li>On remarque que a−b=2(k1−k2), ce qui est un multiple de 2.<\/li><li>Conclusion :<\/li><li>La différence entre deux nombres pairs est donc toujours un nombre pair. La démonstration est complète.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Hypothèses&quot;, &quot;a = 2k et b = 2ℓ&quot;], [&quot;Calcul&quot;, &quot;a − b = 2(k − ℓ)&quot;], [&quot;Conclusion&quot;, &quot;k − ℓ est entier : a − b est pair.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Preuve par contraposée", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La preuve par contraposée est une méthode courante en logique formelle et en mathématiques pour démontrer une implication de la forme P→Q. Cette méthode consiste à prouver l&#x27;implication en prouvant la contraposée, c&#x27;est-à-dire l&#x27;implication inverse et négative de celle que l&#x27;on veut démontrer.<\/li><li>Exemple : Pour prouver que si un nombre est impair, alors il n&#x27;est pas divisible par 2, on prouve que si un nombre est divisible par 2, alors il est pair.<\/li><li>Soit P→Q, une implication qui signifie : &quot;Si Pest vrai, alors Q est vrai&quot;. La contraposée de cette implication est :<\/li><li>¬Q→¬P Cela signifie : &quot;Si Q est faux, alors P est aussi faux&quot;.<\/li><li>La contraposée d&#x27;une implication a une valeur de vérité équivalente à celle de l&#x27;implication d&#x27;origine. Autrement dit, P→Q est logiquement équivalente à ¬Q→¬P. Ainsi, si l&#x27;on prouve la contraposée ¬Q→¬P, cela prouve aussi P→Q<\/li><li>La preuve par contraposée consiste donc à :<\/li><li>Identifier l&#x27;implication P→Q à prouver.<\/li><li>Prendre la contraposée ¬Q→¬P.<\/li><li>Prouver que la contraposée est vraie.<\/li><li>Conclure que l&#x27;implication initiale P→Q est vraie.<\/li><li>Exemple de preuve par contraposée<\/li><li>Supposons que nous voulons démontrer l&#x27;implication suivante :<\/li><li>Proposition : Si n^2 est un nombre pair, alors n est un nombre pair.<\/li><li>En notation formelle, cela s&#x27;écrit :<\/li><li>P: n^2  est pair,<\/li><li>Q:n est pair.<\/li><li>Nous devons prouver P→Q c&#x27;est-à-dire : &quot;Si n^2 est pair, alors n est pair&quot;.<\/li><li>Étape 1 : Écrire la contraposée<\/li><li>La contraposée de P→Q est : ¬Q→¬P, c&#x27;est-à-dire : &quot;Si n n&#x27;est pas pair (c&#x27;est-à-dire n est impair), alors n^2 n&#x27;est pas pair (c&#x27;est-à-dire n^2 est impair)&quot;.<\/li><li>Étape 2 : Preuve de la contraposée<\/li><li>Supposons que n soit impair. Cela signifie que n=2k+1, pour un entier k.<\/li><li>Calculons n^2 :<\/li><li>n^2 = (2k + 1)^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1.<\/li><li>On voit que n^2 est de la forme où m= 2k^2 + 2k est un entier. Par définition, un nombre de la forme 2m+1 est impair.<\/li><li>Ainsi, si n est impair, n^2 est impair, ce qui prouve la contraposée.<\/li><li>Étape 3 : Conclusion<\/li><li>Comme nous avons prouvé que ¬Q→¬P est vrai, cela implique que P→Q est également vrai. Par conséquent, nous avons démontré que si  n^2 est pair, alors n est pair.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Implication&quot;, &quot;n² pair → n pair&quot;], [&quot;Contraposée&quot;, &quot;Supposer n impair : n = 2k + 1.&quot;], [&quot;Calcul&quot;, &quot;n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1&quot;], [&quot;Conclusion&quot;, &quot;n² est impair ; la contraposée établit l’implication.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Preuve par contradiction", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La preuve par contradiction est une méthode de raisonnement logique très utilisée en mathématiques et en logique formelle. Elle repose sur l&#x27;idée que, pour prouver une proposition P, il suffit de supposer que P est fausse (c&#x27;est-à-dire ¬P) et de démontrer que cela conduit à une contradiction.<\/li><li>Principe de la preuve par contradiction<\/li><li>Supposer le contraire : On suppose que la proposition que l&#x27;on souhaite prouver est fausse. C&#x27;est-à-dire, on suppose ¬P.<\/li><li>Dériver des conséquences : À partir de cette hypothèse, on tire des conséquences logiques en utilisant des règles de raisonnement.<\/li><li>Contradiction : On cherche à montrer que cette hypothèse mène à une contradiction, c&#x27;est-à-dire à une situation où une proposition et sa négation sont toutes les deux vraies en même temps (une contradiction logique, comme Q et ¬Q).<\/li><li>Conclusion : Puisqu&#x27;une contradiction ne peut être vraie, la supposition ¬P doit être fausse. Par conséquent, P doit être vraie.<\/li><li>Exemple: prouver par contradiction que si 3n+2 est impair, alors n est impair.<\/li><li>Nous devons démontrer que :<\/li><li>Si 3n+2 est impair, alors n est impair.<\/li><li>Autrement dit, nous devons prouver que si 3n+2 est impair, alors n doit être impair.<\/li><li>Preuve par contradiction<\/li><li>Étape 1 : Supposition contraire<\/li><li>Nous allons supposer que 3n+2 est impair, mais que n est pair.<\/li><li>Supposons que 3n+2 soit impair.<\/li><li>Supposons aussi que n soit pair. Cela signifie qu&#x27;il existe un entier k tel que n=2k<\/li><li>Étape 2 : Déductions de la supposition<\/li><li>À partir de la supposition n=2k, nous remplaçons n dans l&#x27;expression 3n+2 :<\/li><li>3n+2=3(2k)+2=6k+2. Cela nous donne :  3n+2=6k+2.<\/li><li>Étape 3 : Vérification de la parité de 6k+2<\/li><li>6k+2=2(3k+1),donc elle est divisible par 2, ce qui signifie que 6k+2 est pair.<\/li><li>Étape 4 : Contradiction<\/li><li>Nous avons supposé que 3n+2 était impair, mais nous avons montré que 3n+2=6k+2 est en réalité pair. Cette situation constitue une contradiction.<\/li><li>Étape 5 : Conclusion<\/li><li>Puisque notre hypothèse (que n est pair) conduit à une contradiction, nous pouvons conclure que notre hypothèse est fausse. Par conséquent, si 3n+2 est impair, alors n doit être impair.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Hypothèses&quot;, &quot;3n + 2 est impair et n est pair.&quot;], [&quot;Calcul&quot;, &quot;Si n = 2k, alors 3n + 2 = 2(3k + 1).&quot;], [&quot;Contradiction&quot;, &quot;3n + 2 serait à la fois pair et impair.&quot;], [&quot;Conclusion&quot;, &quot;Donc n est impair.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Preuve par recurrence", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Initialiser au premier entier du domaine étudié.<\/li><li>Pour un entier k arbitraire, supposer la propriété au rang k et établir celle au rang k + 1.<\/li><li>Exemple : montrer que 1 + ⋯ + n = n(n + 1)/2 pour tout n ≥ 1.<\/li><\/ul><\/article><section class=\"study\" data-study=\"steps\" data-config=\"[[&quot;Initialisation&quot;, &quot;Pour n = 1 : 1 = 1 × 2 / 2.&quot;], [&quot;Hypothèse&quot;, &quot;Pour un k ≥ 1, supposer 1 + … + k = k(k + 1)/2.&quot;], [&quot;Hérédité&quot;, &quot;Ajouter k + 1 : k(k + 1)/2 + (k + 1) = (k + 1)(k + 2)/2.&quot;], [&quot;Conclusion&quot;, &quot;Par récurrence, la formule vaut pour tout n ≥ 1.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Démonstration pas à pas<\/h3><\/div><div class=\"studymount\"><\/div><\/section><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Preuve directe&quot;, &quot;Partir des hypothèses et établir la conclusion.&quot;], [&quot;Contraposée&quot;, &quot;Établir ¬Q → ¬P pour prouver P → Q.&quot;], [&quot;Contradiction&quot;, &quot;Supposer la négation du résultat et obtenir une impossibilité.&quot;], [&quot;Récurrence&quot;, &quot;Prouver le cas initial puis transmettre la propriété au suivant.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}, {"title": "Quelques propriétés en logique formelle: Complétude, Consistance et Décidabilité", "topics": [{"title": "Complétude", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La complétude sémantique d’un calcul signifie : si Γ ⊨ A, alors Γ ⊢ A.<\/li><li>Le calcul du premier ordre classique est complet au sens sémantique. La correction est la direction réciproque : Γ ⊢ A implique Γ ⊨ A.<\/li><li>Une théorie complète est une autre notion : pour chaque phrase A, elle démontre A ou ¬A.<\/li><\/ul><\/article>"}, {"title": "Consistance", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Une théorie est consistante si elle ne démontre pas simultanément A et ¬A.<\/li><li>En logique classique, une contradiction permet de déduire toute formule.<\/li><li>Une théorie qui possède un modèle est consistante pour un calcul correct.<\/li><\/ul><\/article>"}, {"title": "Décidabilité", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>Un problème est décidable s’il existe un algorithme qui répond correctement et termine sur chaque entrée.<\/li><li>La validité propositionnelle est décidable par les tables de vérité.<\/li><li>La validité en logique du premier ordre est indécidable en général. Sur un domaine fini fixé, on peut néanmoins vérifier une formule en parcourant ses éléments.<\/li><\/ul><\/article><section class=\"study\" data-study=\"truth\" data-config=\"{}\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Une décision par table de vérité<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}, {"title": "Relations entre les propriétés", "html": "<article class=\"card lessonblock\"><ul class=\"lessonpoints\"><li>La complétude sémantique du calcul du premier ordre ne rend pas sa validité décidable.<\/li><li>Les théorèmes d’incomplétude de Gödel concernent des théories effectivement axiomatisées, consistantes et assez expressives pour formaliser l’arithmétique. Ils ne contredisent pas la complétude sémantique du calcul du premier ordre.<\/li><\/ul><\/article><section class=\"study\" data-study=\"match\" data-config=\"[[&quot;Complétude&quot;, &quot;Toute conséquence sémantique est démontrable dans le calcul.&quot;], [&quot;Consistance&quot;, &quot;Impossible de démontrer simultanément A et ¬A.&quot;], [&quot;Décidabilité&quot;, &quot;Un algorithme termine toujours et répond correctement au problème.&quot;]]\"><div class=\"studyhead\"><span>EXPLORATION INTERACTIVE<\/span><h3>Jeu des associations<\/h3><\/div><div class=\"studymount\"><\/div><\/section>"}]}];

function logicParse(raw){let src=String(raw).replace(/<->|<=>/g,'↔').replace(/->|=>|⇒/g,'→').replace(/\bNON\b/gi,'¬').replace(/\bET\b/gi,'∧').replace(/\bOU\b/gi,'∨').replace(/[!~]/g,'¬').replace(/&/g,'∧').replace(/\|/g,'∨').replace(/\s/g,'');if(!src)throw Error('Saisissez une formule.');let pos=0,variables=new Set();const prec={'↔':1,'→':2,'∨':3,'∧':4};function atom(){let c=src[pos++];if(c==='¬')return ['¬',atom()];if(c==='('){let n=expr(1);if(src[pos++]!==')')throw Error('Vérifiez les parenthèses.');return n}if(c==='V'||c==='T'||c==='1')return true;if(c==='F'||c==='0')return false;if(c&&/^[a-z]$/.test(c)){variables.add(c);return c}throw Error('Utilisez des variables sur une lettre et les connecteurs ¬ ∧ ∨ → ↔.')}function expr(min){let left=atom();while(prec[src[pos]]>=min){let op=src[pos++],right=expr(prec[op]+1);left=[op,left,right]}return left}let ast=expr(1);if(pos!==src.length)throw Error('La formule contient une expression inattendue.');return {ast,vars:[...variables].sort()}}
function logicValue(a,e){if(typeof a==='boolean')return a;if(typeof a==='string')return !!e[a];let x=logicValue(a[1],e),y=a.length>2?logicValue(a[2],e):false;return a[0]==='¬'?!x:a[0]==='∧'?x&&y:a[0]==='∨'?x||y:a[0]==='→'?!x||y:x===y}
function logicCompare(F,G){let a=logicParse(F),b=logicParse(G),vars=[...new Set(a.vars.concat(b.vars))].sort();if(vars.length>5)throw Error('Utilisez au plus cinq variables pour garder une table lisible.');let rows=[];for(let i=0;i<2**vars.length;i++){let e={};vars.forEach((x,j)=>e[x]=!!(i&(1<<(vars.length-j-1))));rows.push({e,f:logicValue(a.ast,e),g:logicValue(b.ast,e)})}return {vars,rows,equivalent:rows.every(r=>r.f===r.g)}}
function logicFormula(s){return esc(s).replace(/[¬∧∨→↔]/g,x=>'<span class="logicalop">'+x+'</span>')}

  let x=4,ref=false;function draw(){work.innerHTML='<div class="studyfields"><label>Valeur de n<input data-n type="number" value="'+x+'"></label><button data-change>Préparer l’appel</button><button data-ref>'+(ref?'Passage par variable':'Passage par valeur')+'</button></div><div data-flow></div>';on('[data-change]',()=>{let raw=q('[data-n]').value,n=Number(raw);if(!raw.trim()||!Number.isSafeInteger(n)||Math.abs(n)>1e6){q('[data-flow]').textContent='Saisir un entier entre −1 000 000 et 1 000 000.';return}x=n;draw()});on('[data-ref]',()=>{ref=!ref;draw()});player(q('[data-flow]'),[['Programme principal','n = '+x],['Appel Incrémenter(n)',ref?'p désigne la même variable que n.':'p reçoit une copie de n : p = '+x],['Instruction du sous-programme','p ← p + 1 ; p = '+(x+1)],['Retour au programme principal','n = '+(ref?x+1:x)]],f=>'<div class="studystage"><small>'+esc(f[0])+'</small><b>'+esc(f[1])+'</b></div>')}
  draw()
 }else if(kind==='search'||kind==='sort'||kind==='stack'){
  work.innerHTML='<div class="studyfields"><label>Tableau · entiers séparés par ;<input data-values value="'+(kind==='search'?'2 ; 4 ; 7 ; 9 ; 12 ; 18 ; 22':'8 ; 3 ; 6 ; 1 ; 5')+'"></label>'+(kind==='search'?'<label>Cible<input data-target type="number" value="12"></label><label>Méthode<select data-method><option value="seq">Séquentielle</option><option value="bin">Dichotomique (tableau trié)</option></select></label>':'')+'<button data-start>Préparer le parcours</button></div><div data-flow></div>';
  on('[data-start]',()=>{let p=q('[data-values]').value.split(';'),a=p.map(Number),flow=q('[data-flow]');if(p.some(x=>!x.trim())||a.length>12||a.some(x=>!Number.isSafeInteger(x)||Math.abs(x)>1e6)){flow.textContent='Entrer de 1 à 12 entiers entre −1 000 000 et 1 000 000.';return}
   if(kind==='search'){let target=q('[data-target]').value,bin=q('[data-method]').value==='bin';if(!target.trim()||!Number.isSafeInteger(Number(target))){flow.textContent='Entrer une cible entière.';return}if(bin&&a.some((v,i)=>i&&a[i-1]>v)){flow.textContent='La recherche dichotomique exige un tableau trié dans l’ordre croissant.';return}player(flow,studySearch(a,+target,bin),(f,i)=>cards(a.map((v,j)=>j<f.l||j>f.r?'—':v),f.i)+say(f.found?'Valeur trouvée en position '+(f.i+1)+'.':f.msg))}
   else if(kind==='sort'){player(flow,studyInsert(a),f=>cards(f.a,f.i)+say(f.msg))}
   else{let f=[];for(let n=a.length;n>=0;n--)f.push({n,msg:n?'Somme(T, '+n+') attend Somme(T, '+(n-1)+').':'Cas de base : Somme(T, 0) = 0.'});let sum=0;for(let i=0;i<a.length;i++){sum+=a[i];f.push({n:i+1,msg:'Retour de Somme(T, '+(i+1)+') : '+sum})}player(flow,f,x=>cards(a,x.n-1)+say(x.msg))}
  });q('[data-start]').onclick()
 }else if(kind==='pointer'){
  let mem=[12,25,40],addr=null,msg='p = NIL : aucun emplacement pointé.';function draw(){work.innerHTML='<div class="studystage"><small>POINTEUR p</small><b>'+(addr===null?'NIL':'Adresse '+(100+addr*4))+'</b></div><div class="studycells">'+mem.map((v,i)=>'<button class="studycell '+(i===addr?'current':'')+'" data-address="'+i+'"><small>Adresse '+(100+i*4)+'</small><b>'+v+'</b></button>').join('')+'</div><div class="studyfields"><label>Nouvelle valeur de p^<input data-value type="number" value="30"></label><button data-write>Écrire via p^</button><button data-nil>p ← NIL</button></div>'+say(msg)+'<p>Adresses illustratives ; cliquer sur une case simule p ← adresse(case).</p>';on('[data-address]',b=>{addr=+b.dataset.address;msg='p^ donne la valeur '+mem[addr]+'.';draw()});on('[data-nil]',()=>{addr=null;msg='p = NIL : le pointeur ne désigne plus de case.';draw()});on('[data-write]',()=>{let raw=q('[data-value]').value;if(addr===null)msg='Sélectionner une adresse avant de déréférencer p.';else if(!raw.trim()||!Number.isSafeInteger(+raw))msg='Saisir un entier.';else{mem[addr]=+raw;msg='La case pointée contient maintenant '+mem[addr]+'.'}draw()})}draw()
 }
})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.studyfull').forEach(x=>{x.classList.remove('studyfull');x.querySelector('[data-studyfull]').textContent='⛶ Plein écran'});document.body.classList.remove('studyfullbody')}});
</script></html>
